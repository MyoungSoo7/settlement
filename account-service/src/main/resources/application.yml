spring:
  profiles:
    active: local

  application:
    name: lemuel-account

  threads:
    virtual:
      enabled: true

  # ★ account-service 는 자체 DB(lemuel_account) 를 소유한다 (DB-per-service).
  #   loan·investment·settlement 의 이벤트를 Kafka 로만 수신해 전사 GL 로 집계한다(코드·DB 의존 0).
  datasource:
    url: jdbc:postgresql://localhost:5445/lemuel_account?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-account-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      # 커넥션이 조용히 죽는 것을 막는다 (2026-07-30).
      # 파드와 postgres 가 서로 다른 노드에 있어 유휴 커넥션이 CNI/conntrack 상태 만료로
      # 소리 없이 끊긴다. 그러면 다음 borrow 때 SQLState 08003(connection does not exist)나
      # 'Connection is not available … (total=0)' 로 터진다 — settlement-service 의 outbox 폴러가
      # 이틀간 46회 이렇게 실패했다. keepalive 로 주기적으로 살아있음을 확인하고,
      # max-lifetime 으로 오래된 커넥션을 선제 교체한다. (economics/market/common-data 는 이미 적용됨)
      max-lifetime: 1800000     # 30분
      keepalive-time: 300000    # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # ★ 물리 DB 는 lemuel_account 로 분리되지만 스키마명은 opslab 을 재사용한다
        #   (loan-service 와 동일 — 무스키마 엔티티 매핑이 opslab 으로 해석되도록 통일).
        default_schema: opslab
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ★ account-service 는 자체 DB 마이그레이션을 직접 책임진다.
  flyway:
    enabled: true
    schemas: opslab          # opslab 스키마를 생성·기본 스키마로 사용
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lemuel-account
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8102
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    db:
      enabled: true
  server:
    port: 8103
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # JWT — shared-common JwtProperties(prefix=app.jwt). 루트 스캔이 common.config.jwt 를 잡으므로 secret 필수
  # (order-service 와 동일 시크릿 — JWT 인증 API /api/account/**).
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  # 내부 API(/internal/**) 공유 시크릿 — InternalApiKeyFilter 가 X-Internal-Api-Key 를 검증.
  # card-service(AccountFundingAdapter)의 INTERNAL_API_KEY 와 동일해야 한다. 미설정 시 검증 비활성(개발)+경고.
  internal:
    api-key: ${INTERNAL_API_KEY:}
  kafka:
    # ★ 소비 전용 — 발행 토픽 없음. 아래는 전부 수신(구독) 토픽.
    enabled: ${APP_KAFKA_ENABLED:false}
    consumer:
      concurrency: ${APP_KAFKA_CONSUMER_CONCURRENCY:3}
    topic:
      # 수신 (settlement → account)
      settlement-created: lemuel.settlement.created
      settlement-confirmed: lemuel.settlement.confirmed
      payout-completed: lemuel.payout.completed
      # 수신 (settlement → account) — ADR 0026 Option ① 감액 사건 GL mirror
      settlement-holdback-released: lemuel.settlement.holdback_released
      settlement-holdback-consumed: lemuel.settlement.holdback_consumed
      settlement-adjusted: lemuel.settlement.adjusted
      settlement-canceled: lemuel.settlement.canceled
      seller-recovery-opened: lemuel.seller_recovery.opened
      seller-recovery-offset: lemuel.seller_recovery.offset
      # 수신 (settlement → account) — ADR 0029 §B 원천징수 실지급 통합(HIGH #4 봉합)
      settlement-withholding-accrued: lemuel.settlement.withholding_accrued

      # 수신 (loan → account)
      loan-disbursement-requested: lemuel.loan.disbursement_requested
      loan-repayment-applied: lemuel.loan.repayment_applied
      corporate-loan-disbursed: lemuel.loan.corporate_loan_disbursed
      # 수신 (loan → account) — 담보/개인신용 대출 GL 매핑 (담보대출 Phase 2 잔여 이월)
      secured-loan-disbursed: lemuel.loan.secured_loan_disbursed
      secured-loan-repaid: lemuel.loan.secured_loan_repaid
      secured-loan-principal-repaid: lemuel.loan.secured_loan_principal_repaid
      # 수신 (order/point → account) — 포인트는 고객 부채, 보너스·적립은 판촉비.
      point-charged: lemuel.point.charged
      point-granted: lemuel.point.granted
      point-used: lemuel.point.used
      point-restored: lemuel.point.restored
      point-expired: lemuel.point.expired
      point-revoked: lemuel.point.revoked
      # 수신 (investment → account)
      investment-executed: lemuel.investment.executed
  # ADR 0030 Phase 3 — 실체화 잔액(account_balances) 정기 대사.
  # 드리프트 게이지 account.balance.recon.drift.count 가 0 이 아니면 파생 캐시 오염(원장이 정본).
  recon:
    balance:
      enabled: ${APP_RECON_BALANCE_ENABLED:true}
      interval-ms: ${APP_RECON_BALANCE_INTERVAL_MS:600000}      # 10분
      initial-delay-ms: ${APP_RECON_BALANCE_INITIAL_DELAY_MS:60000}
