spring:
  profiles:
    active: local

  application:
    name: lemuel-loan

  threads:
    virtual:
      enabled: true

  # ★ loan-service 는 자체 DB(lemuel_loan) 를 소유한다 (DB-per-service).
  #   order/settlement 의 공유 DB(opslab) 와 물리적으로 분리되며,
  #   정산 데이터는 read-model 이 아닌 Kafka 이벤트로만 수신해 로컬 뷰로 적재한다.
  datasource:
    url: jdbc:postgresql://localhost:5432/lemuel_loan?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-loan-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      # 커넥션이 조용히 죽는 것을 막는다 (2026-07-30).
      # 파드와 postgres 가 서로 다른 노드에 있어 유휴 커넥션이 CNI/conntrack 상태 만료로
      # 소리 없이 끊긴다. 그러면 다음 borrow 때 SQLState 08003(connection does not exist)나
      # 'Connection is not available … (total=0)' 로 터진다 — settlement-service 의 outbox 폴러가
      # 이틀간 46회 이렇게 실패했다. keepalive 로 주기적으로 살아있음을 확인하고,
      # max-lifetime 으로 오래된 커넥션을 선제 교체한다. (economics/market/common-data 는 이미 적용됨)
      max-lifetime: 1800000     # 30분
      keepalive-time: 300000    # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # ★ 스키마명 opslab 을 재사용한다(물리 DB 는 lemuel_loan 으로 분리). shared-common Outbox claim
        #   네이티브 쿼리는 이 default_schema 를 OutboxSchema 로 주입받아 스키마를 한정하므로(하드코딩 아님,
        #   L-6) 이 설정값이 단일 진실이다 — 엔티티 무스키마 매핑·Flyway(schemas)를 이 값과 일치시킨다.
        default_schema: opslab
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ★ settlement-service 와 달리 loan-service 는 자체 DB 마이그레이션을 직접 책임진다.
  flyway:
    enabled: true
    schemas: opslab          # opslab 스키마를 생성·기본 스키마로 사용 (무스키마 DDL 이 여기로 적재됨)
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lemuel-loan
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8084
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    db:
      enabled: true
  server:
    port: 8085
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # JWT — shared-common JwtProperties(prefix=app.jwt). 루트 @SpringBootApplication 이
  # common.config.jwt 를 스캔하므로 secret 이 필수다(order-service 와 동일 시크릿).
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    consumer:
      concurrency: ${APP_KAFKA_CONSUMER_CONCURRENCY:3}
    topic:
      partitions: ${APP_KAFKA_TOPIC_PARTITIONS:3}
      # 수신 (settlement → loan)
      settlement-created: lemuel.settlement.created
      settlement-confirmed: lemuel.settlement.confirmed
      # 수신 (company → loan) — 평판 등급 변동 → 로컬 리스크 프로젝션 (ADR 0023 Phase 3)
      company-reputation-changed: lemuel.company.reputation_changed
      # 발행 (loan → settlement). Outbox 폴러가 aggregateType="Loan"+eventType 으로 자동 라우팅하는
      # 실제 토픽명(snake_case). settlement 측 컨슈머(Chunk 7)가 이 이름으로 구독해야 한다.
      loan-disbursement-requested: lemuel.loan.disbursement_requested
      loan-repayment-applied: lemuel.loan.repayment_applied
      # 발행 (loan → *). 기업 신용대출 실행 이벤트. eventType="CorporateLoanDisbursed" → 이 토픽으로 라우팅.
      corporate-loan-disbursed: lemuel.loan.corporate_loan_disbursed

  # 선정산 대출 정책 (정산예정금 기반 단순 모델 — CreditPolicy 빈에 주입)
  loan:
    ltv: ${APP_LOAN_LTV:0.80}                 # 한도 = 미지급 정산예정금 × LTV
    daily-rate: ${APP_LOAN_DAILY_RATE:0.0002} # 수수료 = 선지급액 × 일할이율 × 일수
    # 기업 신용대출 (상장사 재무·평판 기반 신용평가 — CorporateCreditPolicy 빈에 주입)
    corporate:
      equity-limit-ratio: ${APP_LOAN_CORP_EQUITY_LIMIT_RATIO:0.10}  # 한도 = 자본총계 × 이 비율 × 등급계수
    # financial-statements-service 공개 API (회사 + 최신 요약 재무제표 조회)
    financial:
      base-url: ${APP_LOAN_FINANCIAL_BASE_URL:http://localhost:8086}
    # economics-service 공개 API (한국은행 기준금리 BASE_RATE 최신값 — 담보/개인신용 금리 산정)
    economics:
      base-url: ${APP_LOAN_ECONOMICS_BASE_URL:http://localhost:8087}
    # market-service 공개 API (KRX 시세 — 주식(EQUITY) 담보 시가 평가: 종가 × 수량, 실패 시 제시값 폴백)
    market:
      base-url: ${APP_LOAN_MARKET_BASE_URL:http://localhost:8094}
    # common-data-service 공개 API (주택 실거래가 — REAL_ESTATE 담보 평가).
    # real-estate-source 미설정이면 이 경로는 비활성(제시값 확정) — DATA_GO_KR_API_KEY 미보유 환경 기본값.
    commondata:
      base-url: ${APP_LOAN_COMMONDATA_BASE_URL:http://localhost:8098}
      real-estate-source: ${APP_LOAN_COMMONDATA_RE_SOURCE:}
      price-field: ${APP_LOAN_COMMONDATA_PRICE_FIELD:dealAmount}
      price-unit-multiplier: ${APP_LOAN_COMMONDATA_PRICE_UNIT:10000}   # 국토부 실거래가는 만원 단위
      records-limit: ${APP_LOAN_COMMONDATA_RECORDS_LIMIT:100}
    # 담보/개인신용 대출 (SecuredLoanPolicy) — base-rate-percent 는 economics 미가용 시 폴백 겸 기본값
    secured:
      base-rate-percent: ${APP_LOAN_SECURED_BASE_RATE:3.5}
      real-estate-ltv: ${APP_LOAN_SECURED_REAL_ESTATE_LTV:0.70}
    # 평판 등급별 한도 haircut (ADR 0023 Phase 3 후속) — 셀러 법인 뉴스 평판이 나쁠수록 한도 축소.
    # 등급 미상(매핑/이벤트 미수신)이면 1.0(무변동, fail-open).
    reputation:
      haircut:
        a: ${APP_LOAN_REP_HAIRCUT_A:1.0}
        b: ${APP_LOAN_REP_HAIRCUT_B:1.0}
        c: ${APP_LOAN_REP_HAIRCUT_C:0.85}
        d: ${APP_LOAN_REP_HAIRCUT_D:0.70}
        e: ${APP_LOAN_REP_HAIRCUT_E:0.0}
