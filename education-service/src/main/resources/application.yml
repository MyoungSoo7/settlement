spring:
  application:
    name: lemuel-education
  datasource:
    url: ${EDUCATION_DB_URL:jdbc:postgresql://localhost:5451/lemuel_education}
    username: ${EDUCATION_DB_USERNAME:${POSTGRES_USER}}
    password: ${EDUCATION_DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: education
  flyway:
    enabled: true
    schemas: education
    default-schema: education
    create-schemas: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8115}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
app:
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
