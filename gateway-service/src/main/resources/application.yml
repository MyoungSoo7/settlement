spring:
  application:
    name: lemuel-gateway

  main:
    # Gateway 는 WebFlux(reactive) 기반이므로 명시적으로 고정한다.
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service-orders
              uri: ${ORDER_SERVICE_URI:http://localhost:8088}
              # 백엔드 컨트롤러 매핑에 맞춘 경로(게이트웨이는 prefix 미변경 전달). order 는 컨트롤러별
              # prefix 가 혼재한다: 거래/회원/인증계는 비-/api(/auth,/users,/orders,/payments,/coupons,
              # /reviews,/games,/categories,/memberships,/products), 상품/카테고리/태그/환불이력은 /api.
              predicates:
                - Path=/auth/**,/users/**,/orders/**,/payments/**,/coupons/**,/reviews/**,/games/**,/categories/**,/memberships/**,/products/**,/api/products/**,/api/categories/**,/api/tags/**,/api/payments/**,/api/menus/**,/admin/categories/**,/admin/products/**,/admin/pg/**,/admin/menus/**,/admin/common-codes/**,/admin/rbac/**,/admin/settlement-projection/**,/admin/payment-expiry/**,/admin/stock-reclaim/**,/admin/seller-tiers/**,/admin/shipments/**,/admin/option-catalog/**,/display-sections/**,/admin/display-sections/**
            - id: loan-service
              uri: ${LOAN_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/loans/**
            - id: financial-statements-service
              uri: ${FINANCIAL_SERVICE_URI:http://localhost:8086}
              # 공개 조회 API 만 라우팅 — DART 수집 트리거(/admin/financial/**)는 외부 미노출
              predicates:
                - Path=/api/financial/**
            - id: economics-service
              uri: ${ECONOMICS_SERVICE_URI:http://localhost:8087}
              # 공개 조회 API 만 라우팅 — ECOS 수집 트리거(/admin/economics/**)는 외부 미노출
              predicates:
                - Path=/api/economics/**
            - id: company-service
              uri: ${COMPANY_SERVICE_URI:http://localhost:8090}
              # 조회 API 라우팅 — workforce는 company-service가 JWT ADMIN/MANAGER를 강제하고,
              # 뉴스 수집 트리거(/admin/company/**)는 외부 미노출
              predicates:
                - Path=/api/company/**
            - id: market-service
              uri: ${MARKET_SERVICE_URI:http://localhost:8094}
              # 공개 조회 API 만 라우팅 — KRX 시세 수집 트리거(/admin/market/**)는 외부 미노출
              predicates:
                - Path=/api/market/**
            - id: common-data-service
              uri: ${COMMON_DATA_SERVICE_URI:http://localhost:8098}
              # 공개 조회 API 만 라우팅 — 소스 등록/수집 트리거(/admin/commondata/**)는 외부 미노출
              predicates:
                - Path=/api/common-data/**
            - id: ai-service
              uri: ${AI_SERVICE_URI:http://localhost:8096}
              # AI 챗봇 — 채팅/대화 이력. 서비스 자체 보안 체인이 JWT(USER 이상)를 강제
              predicates:
                - Path=/api/ai/**
            - id: operation-service
              uri: ${OPERATION_SERVICE_URI:http://localhost:8092}
              # 운영 관제 콘솔(인시던트) — JWT ROLE_ADMIN 전용, webhook 은 Bearer 필터가 자체 게이팅
              predicates:
                - Path=/api/ops/**
            - id: investment-service
              uri: ${INVESTMENT_SERVICE_URI:http://localhost:8100}
              # 투자서비스 — 투자점수/주문/재원. shared-common JWT 체인이 인증 강제
              predicates:
                - Path=/api/investment/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:http://localhost:8102}
              # 계정계 — 대출·투자·정산 GL 집계/시산표. shared-common JWT 체인이 인증 강제
              predicates:
                - Path=/api/account/**
            - id: organization-service
              uri: ${ORGANIZATION_SERVICE_URI:http://localhost:8104}
              # 조직관리 — 셀러/기업 조직·멤버십·역할. shared-common JWT 체인이 인증 강제
              predicates:
                - Path=/api/organizations/**
            - id: card-service
              uri: ${CARD_SERVICE_URI:http://localhost:8106}
              predicates:
                - Path=/api/cards/**
            - id: insurance-service
              uri: ${INSURANCE_SERVICE_URI:http://localhost:8108}
              # GA 보험대리점 — 상담·청약·계약·유지변경·수수료 정산. shared-common JWT 체인이 인증 강제
              predicates:
                - Path=/api/insurance/**
            - id: deposit-service
              uri: ${DEPOSIT_SERVICE_URI:http://localhost:8112}
              # 셀러 예치금 원장 — 재원 이중사용 차단. /api 는 읽기 전용(본인·운영자 잔고 조회),
              # /admin 은 잔고를 움직이는 수기 콘솔(ADMIN 전용). 두 경로의 권한 등급이 다르므로
              # 하나의 와일드카드로 합치지 않는다.
              predicates:
                - Path=/api/deposits/**,/admin/deposits/**
            - id: settlement-service
              uri: ${SETTLEMENT_SERVICE_URI:http://localhost:8082}
              # SettlementController 는 /settlements(비-/api), 검색/원장/리포트는 /api, 운영 콘솔은 /admin.
              predicates:
                - Path=/settlements/**,/api/settlements/**,/api/ledger/**,/api/reports/**,/api/tax-invoices/**,/api/seller/bank-account,/admin/payouts/**,/admin/seller-bank-accounts/**,/admin/chargebacks/**,/admin/pg-reconciliation/**,/admin/reconciliation/**,/admin/dlq/**,/admin/backfill/**,/admin/event-track/**,/admin/ledger-periods/**,/admin/seller-tax-profiles/**,/admin/tax/**,/admin/commission-rates/**
            - id: market-stream-service
              uri: ${MARKET_STREAM_SERVICE_URI:http://localhost:8110}
              # 폴리글랏(Go, 8110) 실시간 시세 SSE — 공개 read-only 스트림만 라우팅.
              # 서비스 실경로는 /stream/{code} 라 프리픽스를 벗겨 전달한다. /ws/** 는 미노출(프론트는 SSE 만 사용).
              predicates:
                - Path=/api/market-stream/**
              filters:
                - RewritePath=/api/market-stream/(?<segment>.*), /$\{segment}
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8130}
              # 폴리글랏(Kotlin, 8130) 알림 푸시 SSE — 스트림 하나만 노출한다.
              # /notifications/send·/notifications/demo 는 인증 없이 발송하는 내부 경로라
              # 게이트웨이에 올리지 않는다(와일드카드 금지). 서비스 실경로는 /notifications/stream.
              predicates:
                - Path=/api/notifications/stream
              filters:
                - RewritePath=/api/notifications/stream, /notifications/stream

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
