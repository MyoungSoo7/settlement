# 운영(prod) 프로파일 — SPRING_PROFILES_ACTIVE=prod 로 활성.
#
# 기본(로컬/개발) 프로파일은 MARKET_INTERNAL_API_KEY 미설정 시 fail-open(경고 후 통과)으로 개발
# 편의를 보존하지만, 운영에서는 이 플래그를 고정해 fail-closed 로 전환한다: 키가 주입되지 않으면
# /admin/market/**(KRX 수집 트리거) 호출을 통과가 아니라 403 으로 거부한다(AdminApiKeyFilter).
#
# 2026-08-11: 실제로 이 사고가 났다. settlement-api-keys 시크릿에 MARKET_INTERNAL_API_KEY 만
# 빠져 있었고(형제 5개는 있었다), market 만 이 프로파일이 없어 fail-open 경로를 타는 바람에
# 클러스터 내부에서 헤더 없이 수집 트리거가 호출 가능한 상태였다. 시크릿은 helm-deploy #117 로
# 채웠지만, 키 누락이 곧 무방비 노출이 되는 구조 자체를 배포 프로파일 차원에서 끊는다.
# (gateway 가 /admin/market/** 를 라우팅하지 않아 외부 노출은 없었다.)
app:
  security:
    internal-key-required: true
