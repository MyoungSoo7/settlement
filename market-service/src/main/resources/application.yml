spring:
  profiles:
    active: local

  application:
    name: lemuel-market

  threads:
    virtual:
      enabled: true

  # ★ market-service 는 자체 DB(lemuel_market) 를 소유한다 (DB-per-service).
  #   공개 read-only 조회 서비스 — 다른 서비스와 코드·DB·이벤트 의존 없음.
  datasource:
    url: jdbc:postgresql://localhost:5441/lemuel_market?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-market-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      idle-timeout: 600000      # 10분
      max-lifetime: 1800000     # 30분
      keepalive-time: 300000    # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 샘플 시드 마이그레이션 제거 — 기존 DB(이미 적용된 시드)를 "missing"으로 관대 처리.
    # 신규 배포는 시드 없이 실데이터(KRX 자동 수집 스케줄러)로만 채운다.
    ignore-migration-patterns: "*:missing"

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=600s

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8094
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  market:
    # /admin/market/** 게이트 공유 시크릿 — 미설정 시 통과+경고 (로컬 전용, 운영 필수)
    internal-api-key: ${MARKET_INTERNAL_API_KEY:}
    krx:
      # data.go.kr 발급 인증키(Decoding 키) — 미설정이면 수집 비활성(Flyway 시드 데이터로만 동작)
      api-key: ${KRX_API_KEY:}
      base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
      # 페이지당 행 수 — KRX 상장사 ≈2800, 1000 이면 3콜로 하루치 완주
      page-size: 1000
    sync:
      request-interval-ms: 150   # data.go.kr 쿼터 보호용 페이지 호출 간격
      schedule:
        cron: "0 30 7 * * *"     # 매일 07:30 KST 자동 KRX 수집 (data.go.kr T+1 지연 고려)
        zone: Asia/Seoul
        # 최근 N일 재조회 (주말/공휴일/지연 갭 흡수, 거래일 아니면 0건).
        # 3 이면 금요일이 영구 결손된다 — data.go.kr 은 금요일치를 월요일 "낮"에 올리는데
        # 3일 룩백의 마지막 기회가 월 07:30 이라 매번 빈손이고, 화요일엔 창을 벗어난다.
        # 실제로 2026-07-16(스케줄러 도입일)~08-07 사이 금요일 3일치가 전부 비었다.
        # 7 이면 금요일이 그 주 금요일까지 재시도되고 연휴 갭도 함께 흡수한다.
        lookback-days: 7
