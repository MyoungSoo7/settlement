spring:
  profiles:
    active: local

  application:
    name: lemuel-ai

  threads:
    virtual:
      enabled: true

  # ★ ai-service 는 자체 DB(lemuel_ai) 를 소유한다 (DB-per-service).
  #   로컬 기본값은 compose 의 호스트 매핑(127.0.0.1:5442 → ai-postgres:5432)을 가리킨다.
  #   이미지는 pgvector/pgvector:pg17 — Phase 3 RAG 대비 선점(Phase 1 은 확장 미활성).
  datasource:
    url: jdbc:postgresql://localhost:5442/lemuel_ai?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-ai-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      # 커넥션이 조용히 죽는 것을 막는다 (2026-07-30).
      # 파드와 postgres 가 서로 다른 노드에 있어 유휴 커넥션이 CNI/conntrack 상태 만료로
      # 소리 없이 끊긴다. 그러면 다음 borrow 때 SQLState 08003(connection does not exist)나
      # 'Connection is not available … (total=0)' 로 터진다 — settlement-service 의 outbox 폴러가
      # 이틀간 46회 이렇게 실패했다. keepalive 로 주기적으로 살아있음을 확인하고,
      # max-lifetime 으로 오래된 커넥션을 선제 교체한다. (economics/market/common-data 는 이미 적용됨)
      max-lifetime: 1800000 # 30분
      keepalive-time: 300000 # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  # 자체 DB 마이그레이션을 직접 책임진다 (V1 대화 코어).
  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8096
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # JWT — shared-common JwtProperties(prefix=app.jwt). common.config.jwt 를 스캔하므로
  # secret 이 필수다(order-service 와 동일 시크릿 — 토큰 발급은 order, 검증만 여기서).
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

  ai:
    # LLM provider 선택 — gemini(기본) | anthropic | deepseek.
    # 어댑터가 @ConditionalOnProperty 로 정확히 하나만 등록된다(오타를 내면 셋 다 등록되지 않아 채팅 빈이 없다).
    provider: ${APP_AI_PROVIDER:gemini}
    chat:
      # (provider=anthropic 일 때) Anthropic Messages API — company-service 감성분석과 동일 env var 공용.
      # 미설정 시: 부팅·이력 조회는 정상, 채팅만 503 안내 (economics 의 "키 미설정 → 수집 비활성" 철학).
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${APP_AI_CHAT_MODEL:claude-opus-4-8}
      max-tokens: 1024
      # 컨텍스트 윈도 — LLM 에 실어 보내는 직전 메시지 수 (비용 상한의 1차 장치)
      history-window: 10
      timeout-seconds: 30
      # 시스템 프롬프트 — 실데이터 환각 금지가 핵심 (돈 다루는 플랫폼의 AI 안전 장치).
      # Phase 2(Function Calling)에서 실데이터 조회 도구가 붙기 전까지는 "모른다"가 정답이다.
      system-prompt: >-
        당신은 Lemuel 이커머스·정산 플랫폼의 AI 도우미입니다.
        Lemuel 은 주문/결제, 셀러 정산(등급별 수수료 NORMAL 3.5%/VIP 2.5%/STRATEGIC 2.0%,
        정산주기 T+7/T+3/T+1 영업일), 선정산 대출, 재무제표·경제지표·기업뉴스 조회를 제공합니다.
        일반 지식과 플랫폼 사용 안내에는 친절하고 간결하게 한국어 존댓말로 답하세요.
        단, 사용자의 실제 주문·결제·정산 금액 등 개인 데이터는 아직 조회할 수 없으므로
        절대 지어내지 말고 "곧 조회 기능이 연동될 예정"이라고 안내하세요.
        개인정보(카드번호·주민번호 등)를 입력하지 않도록 안내하세요.
    gemini:
      # (provider=gemini, 기본) Google Generative Language API — company-service 감성분석과 동일 키(GEMINI_API_KEY) 공용.
      # 미설정 시: 부팅·이력 조회는 정상, 채팅만 503 안내.
      api-key: ${GEMINI_API_KEY:}
      model: ${APP_AI_GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com
      # 2.5 계열은 thinking 이 출력 예산을 먹을 수 있어 넉넉히 잡는다(빈 응답 방지).
      max-tokens: 2048
    deepseek:
      # (provider=deepseek) OpenAI 호환 Chat Completions — POST {base-url}/chat/completions.
      # 미설정 시: 부팅·이력 조회는 정상, 채팅만 503 안내.
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${APP_AI_DEEPSEEK_MODEL:deepseek-chat}
      # ★ 같은 어댑터로 로컬 Ollama 를 쓸 수 있다(외부 크레딧 없이 개발·데모):
      #     APP_AI_DEEPSEEK_BASE_URL=http://localhost:11434/v1
      #     APP_AI_DEEPSEEK_MODEL=deepseek-r1:7b
      #     DEEPSEEK_API_KEY=ollama   ← Ollama 는 키를 안 보지만, 비워 두면 "미구성"으로 판정돼 채팅이 503 이다
      #   (RTX 3050 8GB 기준 7b/8b Q4 까지. 671B 본체 R1/V3 는 로컬 구동 불가)
      base-url: ${APP_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      # deepseek-reasoner / r1 계열은 사고과정이 예산을 먹으므로 넉넉히(빈 응답 방지).
      max-tokens: 2048
    rate-limit:
      # LLM 비용 가드 — 사용자별 채팅 호출 상한. 초과 시 429 + Retry-After.
      per-minute: ${APP_AI_RATE_PER_MINUTE:5}
      per-day: ${APP_AI_RATE_PER_DAY:100}

    # ── RAG (ADR 0034) ────────────────────────────────────────────────
    # 기본 false. 켜야만 KnowledgeController·검색 서비스·임베딩 어댑터 빈이 등록되고,
    # 꺼져 있으면 RagWiringConfig 의 "근거 0건" 포트가 대신 꽂혀 Phase 1 과 동작이 같아진다.
    # ★ true 로 켜기 전 확인: 대상 DB 에 pgvector 확장이 있고 앱 계정이 슈퍼유저인가.
    #   (마이그레이션 V20260812150000 이 CREATE EXTENSION 을 시도하고, 실패하면 부팅이 멈춘다)
    rag:
      enabled: ${APP_AI_RAG_ENABLED:false}
      # 프롬프트에 실을 근거 청크 수 — 컨텍스트 길이·비용의 1차 상한.
      top-k: ${APP_AI_RAG_TOP_K:4}
      # 코사인 유사도 하한. 이보다 낮은 근거는 "관련 없음"으로 보고 버린다 —
      # 무관한 근거를 붙이는 것은 근거를 안 붙이는 것보다 나쁘다(환각을 오히려 부추긴다).
      min-similarity: ${APP_AI_RAG_MIN_SIMILARITY:0.55}
      # 청크 크기·겹침(문자 기준). 겹침은 문단 경계에서 잘린 문맥을 복구하는 보험.
      chunk-max-chars: ${APP_AI_RAG_CHUNK_MAX:1200}
      chunk-overlap-chars: ${APP_AI_RAG_CHUNK_OVERLAP:200}

    # 임베딩 벤더 배선 — rag 정책(위)과 분리한다. 모델 id 는 여기 하나뿐이고,
    # 청크마다 DB(knowledge_chunks.embedding_model)에 기록돼 모델 교체를 감지한다.
    embedding:
      # 채팅과 같은 GEMINI_API_KEY 를 공용. 미설정 시 적재는 503, 검색은 근거 0건.
      api-key: ${GEMINI_API_KEY:}
      model: ${APP_AI_EMBEDDING_MODEL:gemini-embedding-001}
      base-url: https://generativelanguage.googleapis.com
      # ★ 3072(기본) 이 아니라 768 인 이유: pgvector 의 vector 타입은 2000 차원까지만
      #   인덱싱된다. MRL 학습 모델이라 절단이 허용되며, 절단 시 L2 정규화는 수동 책임이다
      #   (어댑터가 수행). 3072 를 쓰려면 halfvec(4000 까지) 로 스키마를 바꿔야 한다.
      dimension: ${APP_AI_EMBEDDING_DIMENSION:768}
