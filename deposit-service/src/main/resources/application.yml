spring:
  profiles:
    active: local

  application:
    name: lemuel-deposit

  threads:
    virtual:
      enabled: true

  # ★ deposit-service 는 자체 DB(lemuel_deposit) 를 소유한다 (DB-per-service).
  #   셀러 예치금·에스크로 원장의 단일 진실원 — 다른 서비스(settlement/card/account) 코드·DB 직접 의존 0,
  #   Kafka 이벤트(Outbox 발행)로만 잔액 변동을 외부에 알린다.
  datasource:
    url: jdbc:postgresql://localhost:5449/lemuel_deposit?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-deposit-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      max-lifetime: 1800000 # 30분 — 유휴 커넥션 CNI/conntrack 만료로 조용히 죽는 것 방지
      keepalive-time: 300000 # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # ★ 스키마명은 opslab 재사용(물리 DB 는 lemuel_deposit 로 분리).
        #   shared-common Outbox claim 네이티브 쿼리가 'opslab.outbox_events' 를 하드코딩한다.
        default_schema: opslab
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    schemas: opslab
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lemuel-deposit
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # 8108/8109 는 insurance-service 가 이미 쓴다(두 서비스가 각자 브랜치에서 같은 번호를 잡았다).
  # 같은 호스트에서 둘 다 띄우면 뒤에 뜬 쪽이 기동 실패하므로 deposit 을 다음 빈 쌍으로 옮겼다.
  port: 8112
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    db:
      enabled: true
  server:
    port: 8113
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # JWT — shared-common JwtProperties(prefix=app.jwt). order-service 와 동일 시크릿.
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    consumer:
      concurrency: ${APP_KAFKA_CONSUMER_CONCURRENCY:3}
    topic:
      owner: deposit-service   # ADR 0035 — 이 모듈이 발행(소유)하는 토픽만 만든다(파티션 정본은 topic-catalog.json)
      # 발행 (deposit → *) — DepositEventPublisherAdapter 가 Outbox 경유로 발행.
      # 토픽명은 KafkaOutboxPublisher 가 aggregateType="Deposit"+eventType 에서 자동 파생한다
      # (lemuel.<aggregate>.<event_snake>) — 아래 키는 그 결과를 문서화한 것으로 코드가 직접 참조하지 않는다.
      deposit-balance-changed: lemuel.deposit.balance_changed
      deposit-hold-placed: lemuel.deposit.hold_placed
      deposit-hold-released: lemuel.deposit.hold_released
      deposit-offset-applied: lemuel.deposit.offset_applied
      # 부족분 발생 — 발행 전용. 소비하는 컨슈머는 아직 없음(추후 정산/알림 서비스 쪽에서 구현 예정).
      deposit-offset-shortfall: lemuel.deposit.offset_shortfall
      # 구독 (* → deposit) — @KafkaListener 가 아래 키를 플레이스홀더로 직접 참조한다.
      # 발행측은 settlement-service 다. account-service 도 같은 두 토픽을 구독하지만
      # 컨슈머 그룹이 달라(lemuel-account) 서로의 오프셋에 영향을 주지 않는다(pub/sub 팬아웃).
      settlement-confirmed: lemuel.settlement.confirmed
      payout-completed: lemuel.payout.completed
      # ※ lemuel.card.authorized / lemuel.card.captured 는 아직 구독하지 않는다.
      #   두 이벤트의 페이로드에 sellerId 가 없고(cardAccountId 만 있다) card 의 sellerId 는
      #   String, deposit 은 Long 이라 이벤트만으로 대상 예치 계좌를 특정할 수 없다.
      #   그때까지 hold·offset 입력은 /admin/deposits 콘솔 경로다(SPEC §3.16).

  deposit:
    hold:
      # 만료 hold 회수 — 매시 5분(KST). 일 1회면 만료와 회수 사이에 최대 24시간의 공백이 생기고
      # 그동안 셀러 가용액이 이유 없이 줄어 있다. 회수는 계좌 단건 락이라 자주 도는 비용이 더 싸다.
      expiry-cron: ${APP_DEPOSIT_HOLD_EXPIRY_CRON:0 5 * * * *}
    shortfall:
      # 부족분 적체 지표 갱신 주기. Gauge 콜백에서 DB 를 읽지 않는 대신 여기서 스냅샷을 채운다
      # (스크레이프가 DB 지연을 물지 않게 — ShortfallBacklogMetrics 참조).
      metrics-interval-ms: ${APP_DEPOSIT_SHORTFALL_METRICS_INTERVAL_MS:300000}
      metrics-initial-delay-ms: ${APP_DEPOSIT_SHORTFALL_METRICS_INITIAL_DELAY_MS:30000}
      # 0 이면 경고 로그 없음(지표만). 운영에서 값을 넣어 적체를 사람에게 알린다 —
      # 부족분은 자동으로 해소되지 않으므로 아무도 안 보면 조용히 쌓인다.
      alert-threshold: ${APP_DEPOSIT_SHORTFALL_ALERT_THRESHOLD:0}
