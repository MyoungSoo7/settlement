# Seed: settlement-service 세무 as-is 사양 (부가세·원천징수·세금계산서 스캔 대사)
# 상태: CONFIRMED (역산 결정화, 2026-08-22)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.
# 자매 Seed: settlement-service-accounting-core — 그 Seed 가 범위 밖에 둔 tax 슬라이스가 이 문서다(감사 R-2).

seed:
  id: settlement-service-tax-v1
  goal: >-
    settlement-service 세무 슬라이스(부가세 포함과세 분리·개인 셀러 원천징수·세금계산서 발행과
    스캔본 대사)의 현행 동작을 실행 가능한 게이트에 매핑된 불변 사양으로 결정화해,
    회귀 기준선 · 세무 항등식 드리프트 방지 · 면접/포트폴리오 문서로 사용한다.

  scope:
    included:
      - TaxCalculation 항등식 3종과 산출 직후 자가검증
      - 세무 전용 라운딩(원단위 절사)과 공용 Money VO 와의 분리 이유
      - 셀러 세무 프로파일(개인/사업자)과 미등록 처리
      - 세금계산서 발행번호 규칙과 스캔본 왕복 검증·IDOR 대조
      - 스캔 상태머신 5상태와 저신뢰 판독 보류 규칙
      - 원천징수의 실제 지급 공제 경로
    excluded:
      - 정산 생성·수수료·홀드백 (settlement-service-accounting-core Seed 소관)
      - 국세청 실연동 (발행은 내부 번호 체계)
      - OCR 제공자 내부 (Gemini·텍스트레이어 어댑터 구현 상세)
      - 월마감·정합성 스위트 (별도 Seed)

  constraints:
    - "세무 금액은 원단위 절사(scale 0, DOWN) — 공용 Money(scale 2 HALF_UP)를 통과시키지 않는다"
    - "중간 나눗셈은 스케일 10 명시 — 이후 floorToWon 이 0 으로 절사하므로 방향만 같으면 결과가 동일하다"
    - "세무 금액 음수 금지 — TaxRounding 이 입력에서 거부"
    - "도메인 규칙 위반은 TaxDomainException 계열로 — generic IAE 금지"
    - "대사 판정은 순수 도메인에서 — 포트·DB 없이 값만으로 결론을 낸다"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 settlement-service/src/main/java/github/lms/lemuel/tax/)
    vat_inclusive:
      source: domain/TaxCalculation.java:16-18,34-36
      rule: "vatAmount = floor(commission x 10/110), supplyAmount = commission − vatAmount. 수수료가 부가세 포함 총액이다(ADR 0029)"
      history: "과거 외부과세 모델(commission x 0.10 별도 청구)은 실제로 청구되지 않는 미수금을 무한히 쌓는 결함이었다 — 부가세는 수수료 안에서 갈라내는 것이지 별도로 받는 게 아니다"
    withholding:
      source: domain/TaxCalculation.java:19-20,44
      rule: "withholdingAmount = 개인 ? floor(netAmount x 0.033) : 0 (소득세 3% + 지방소득세 0.3%), netPayable = netAmount − withholdingAmount"
      business_seller: "사업자에게 원천징수가 붙으면 항등식 자가검증이 거부한다 (TaxCalculation.java:141)"
    withholding_deducted_from_actual_payout:
      source: ../settlement/adapter/in/batch/confirm/SettlementConfirmItemWriter.java:29
      rule: "payout 금액 = immediate − withholding − offset (차감 순서 T-4 로 확정)"
      history: "과거엔 세무 전표(장부)만 줄이고 실제 송금은 전액 나갔다 — 독립 GL 감사 HIGH #4 로 봉합"
    self_verified_identities:
      source: domain/TaxCalculation.java:122-142
      rule: "산출 직후 네 가지를 구성적으로 확인한다"
      checks:
        - "세무 예수금 음수 금지"
        - "포함과세 항등식: 공급가액 + 세액 = commission"
        - "실지급액 항등식: netPayable = netAmount − withholdingAmount"
        - "원천징수액이 순정산액 초과 금지 · 사업자 원천징수 금지"
    tax_rounding_separated_from_money:
      source: domain/TaxRounding.java:11-18,29-36
      rule: "floorToWon = setScale(0, DOWN). 공용 Money(scale 2 HALF_UP)를 통과시키면 반올림이 먼저 개입해 세무 절사 의미가 손상된다"
      note: "세무 금액은 음수가 아니므로 DOWN 은 floor 와 동치. 음수 입력은 TaxInvariantViolationException"
    invoice_number_derivation:
      source: domain/scan/TaxInvoiceScanMatcher.java:11-14
      rule: "발행번호는 TaxInvoice.numberFor(settlementId) 로 정산 식별자에서 결정적으로 파생 — 형식의 권위는 TaxInvoice 한 곳에 남는다"
    roundtrip_verification:
      source: domain/scan/TaxInvoiceScanMatcher.java:25-50
      rule: "스캔본 승인번호에서 숫자만 추출해 후보를 만들고, 그 후보로 다시 만든 발행번호가 원문과 똑같아야 우리 번호로 인정 — 타사 계산서 번호의 우연한 매칭을 막는다"
    idor_before_amount:
      source: domain/scan/TaxInvoiceScanMatcher.java:16-18
      rule: "후보 발행분의 소유 셀러가 업로더와 다르면 금액이 아무리 같아도 대사하지 않는다 — 남의 번호로 타인의 정산 정보를 확인하는 경로 차단"
    scan_state_machine:
      source: domain/scan/TaxInvoiceScanStatus.java:12-20
      transitions: >-
        EXTRACTED -> MATCHED|MISMATCHED|UNMATCHED|REJECTED ·
        MISMATCHED -> MATCHED|REJECTED · UNMATCHED -> MATCHED|REJECTED · MATCHED·REJECTED 는 종결
      no_lateral_move: "MISMATCHED <-> UNMATCHED 를 서로 오갈 수 없게 한 것은 의도적 — 번복 경로가 '재대사해서 MATCHED' 또는 '반려' 둘뿐이어야 조사 이력이 남는다"
      matched_is_terminal: "MATCHED 는 반려조차 불가능한 종결이라 자동 진입이 보수적이어야 한다"
    low_confidence_holds_in_extracted:
      source: domain/scan/TaxInvoiceScanStatus.java:26-33
      rule: >-
        needsReview 인 스캔은 자동 대사를 건너뛰고 EXTRACTED 에 남는다 — 믿을 수 없는 값으로
        MATCHED(종결)나 UNMATCHED('발행분을 못 찾았다') 같은 결론을 기록하지 않기 위해서다.
        확정은 관리자가 재대사를 눌러야 일어난다.
      sibling_rule: "card-service 의 ExpenseReceipt NEEDS_REVIEW 와 같은 결의 판단"
    typed_exceptions:
      source: domain/exception/
      rule: "TaxDomainException 아래 TaxInvariantViolationException · TaxInvoiceScanStateException · SellerTaxProfileNotRegisteredException — generic IAE 미사용"
    profile_missing_is_observable:
      source: ../settlement/adapter/in/batch/confirm/SettlementConfirmItemWriter.java:43,92-94
      rule: "확정 배치가 withholding.profileRegistered() 를 확인하고 settlement.withholding.shortfall 메트릭으로 노출한다"

  event_contracts:
    publishes:
      - "lemuel.settlement.withholding_accrued — 확정 시점 발행, account GL 이 예수금 인식 (SettlementConfirmItemWriter.java:31 · domain/TaxJournal.java)"
    consumes: []

  rest_surface:
    seller:
      - "GET /api/tax-invoices/settlement/{settlementId} — 자기 정산의 세금계산서 (TaxInvoiceSellerController.java:28)"
      - "/api/tax-invoices/scans — 스캔본 업로드·조회 (TaxInvoiceScanController.java:36)"
    admin:
      - "/admin/tax/scans — 스캔 리뷰 큐(재대사·반려) (TaxInvoiceScanAdminController.java:26)"
      - "/admin/tax/settlements/{settlementId} — 정산 1건의 세무 산출·대사 (SettlementTaxAdminController.java:44)"
      - "/admin/seller-tax-profiles — 셀러 개인/사업자 프로파일 (SellerTaxProfileAdminController.java:28)"

  acceptance_criteria:
    - id: AC-1
      criterion: 포함과세 항등식 공급가액 + 세액 = commission 이 성립한다
      gate: "./gradlew :settlement-service:test — TaxCalculationTest"
    - id: AC-2
      criterion: 실지급액 항등식 netPayable = netAmount − withholding 이 성립한다
      gate: "TaxCalculationTest"
    - id: AC-3
      criterion: 사업자에게 원천징수가 붙지 않는다
      gate: "TaxCalculationTest — TaxInvariantViolationException"
    - id: AC-4
      criterion: 세무 금액이 원단위 절사(DOWN)로 산출된다
      gate: "TaxRoundingTest"
    - id: AC-5
      criterion: 원천징수가 실제 payout 금액에서 공제된다
      gate: "ResolveSettlementWithholdingServiceTest · SettlementTaxDeliverablesIntegrationIT"
    - id: AC-6
      criterion: 타사 번호가 왕복 검증에서 탈락한다
      gate: "TaxInvoiceScanMatcherTest"
    - id: AC-7
      criterion: 남의 발행분과는 금액이 같아도 대사되지 않는다(IDOR)
      gate: "TaxInvoiceScanMatcherTest"
    - id: AC-8
      criterion: 저신뢰 판독이 MATCHED·UNMATCHED 로 종결되지 않는다
      gate: "TaxInvoiceScanMatcherTest · TaxInvoiceScanTest"
    - id: AC-9
      criterion: 상태 전이표 밖 전이가 거부된다(MISMATCHED <-> UNMATCHED 포함)
      gate: "TaxInvoiceScanTest · TaxInvoiceScanIntegrationIT"
    - id: AC-10
      criterion: 모든 인바운드 포트가 어댑터에서 도달 가능하다
      gate: "InboundPortReachabilityTest (ArchUnit)"
    - id: AC-11
      criterion: 세무 대사 항목별 차이가 산출된다
      gate: "TaxReconciliationTest · TaxReconciliationCheckTest · TaxReconciliationServiceTest"
    - id: AC-12
      criterion: 커버리지 LINE >= 90%
      gate: "./gradlew :settlement-service:jacocoTestCoverageVerification"

  test_assets:
    total_files: 29
    unit_and_slice: 27
    integration: 2
    integration_names: "SettlementTaxDeliverablesIntegrationIT · TaxInvoiceScanIntegrationIT"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: "발행번호가 정산 식별자에서 결정적으로 파생된다 — 왕복 검증이 타사 번호를 막는 근거이자, 정산 ID 를 알면 발행번호를 계산할 수 있다는 뜻이다. 대사 자체는 IDOR 대조로 막히지만 번호 자체는 추측 가능한 값이다"
      disposition: by-design-documented (트레이드오프)
    - id: KI-2
      finding: "MATCHED 종결의 되돌림 경로가 없다 — 잘못 대사된 건은 상태로 정정할 수 없고(전이표에 MATCHED -> 가 비어 있다) 새 스캔을 올리는 우회만 남는다. 보수적 자동 진입이 그 대가로 얻은 것이지만 오판정 시 조치 절차가 문서화돼 있지 않다"
      disposition: recorded-not-fixed (러너북 후보)
    - id: KI-3
      finding: "세무 프로파일 미등록은 메트릭으로만 드러난다 — settlement.withholding.shortfall 이 올라가도 정산은 진행된다. 개인 셀러인데 프로파일이 없으면 원천징수 없이 전액이 나간다. 알림·차단이 아니라 관측 지표다"
      disposition: recorded-not-fixed (정책 결정 사항)
    - id: KI-4
      finding: "국세청 실연동이 없다 — 발행은 내부 번호 체계이고 외부 전송·승인 경로가 없다. 대사는 '우리가 발행했다고 기록한 것'과 '셀러가 올린 스캔본' 사이에서만 이뤄진다"
      disposition: by-design (범위 — 실연동 시 승인번호 권위가 국세청으로 옮겨간다)
    - id: KI-5
      finding: "tax 슬라이스가 회계 코어 Seed 의 범위 밖이라 두 Seed 의 경계가 항등식 위에서 만난다 — netPayable 은 이 Seed 가, net·holdback 은 회계 코어가 정의한다. 둘 중 하나만 바뀌면 SettlementConfirmItemWriter 의 차감 순서(T-4)가 조용히 어긋난다"
      disposition: recorded-not-fixed (문서 경계 위험 — 두 Seed 를 함께 읽어야 한다)

  uses:
    - regression-baseline
    - contract-drift-gate
    - interview-portfolio
