# Seed: settlement-anomaly-service 이상탐지 스코어링 as-is 사양 (Ouroboros 방법론 — Interview → Seed 결정화)
# 상태: CONFIRMED (기존 서비스 seed 와 동일 방식 지시로 승인 승계, 2026-08-13)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.

seed:
  id: settlement-anomaly-service-scoring-v1
  goal: >-
    settlement-anomaly-service(Python/FastAPI 8121 — 가맹점 MAD robust z + IsolationForest 앙상블·
    사람이 읽는 근거 문자열·고정 시드 재현성·기동 시 번들 샘플 cold-start)의 현행 동작을
    실행 가능한 게이트에 매핑된 불변 사양으로 결정화해, 회귀 기준선 · 면접/포트폴리오 문서 ·
    후속 실데이터 연동 베이스로 사용한다.

  scope:
    included:
      - 피처 엔지니어링 6종 (순수·순서보존·폴백)
      - 통계 계층 (가맹점 MAD z·오프아워·평균배수·다중 신호 보너스)
      - ML 계층 (IsolationForest 적합·정규화·predict 보정)
      - 앙상블 블렌딩·임계·근거 생성
      - API 표면 (health·train·score·demo) 와 cold-start 수명주기
    excluded:
      - 정산 금액 산정 (settlement-service 소관)
      - 인시던트 라이프사이클·알림 (operation-service 소관)

  constraints:
    - "DB 없음 — 모델·기준선은 프로세스 메모리(무영속 MVP)"
    - "Kafka 의존 없음 — 이벤트 발행/소비 0"
    - "라벨 없음 — 비지도 학습만"
    - "정산 데이터를 직접 조회하지 않는다 — 호출자가 레코드를 실어 보낸다(push)"
    - "Python 3.11 필수 — 핀된 의존성에 3.14 휠 없음"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 settlement-anomaly-service/src/anomaly_service/)
    features:
      source: model/features.py:24-160
      rule: >-
        FEATURE_NAMES = [amount, log_amount(log1p(|amount|)), hour_of_day, merchant_freq,
        amount_dev_from_mean, amount_ratio_to_mean] — 순서 고정, 순수 함수, 입력 순서 보존.
        merchant_freq 는 '이 배치 내 그 가맹점 건수'(groupby transform count).
        merchant_mean 은 baselines 가 주어지면 학습 시점 평균, 없으면 배치 평균(미지 가맹점은 배치 전역 평균)
      timestamp: "_parse_hour 는 ISO-8601 + 'Z' 보정, 실패 시 'T' 뒤 두 자리, 그래도 실패면 0 — 한 건의 나쁜 레코드가 배치를 죽이지 않는다(주석 명문)"
      baseline: "MerchantBaseline{median, mad(=median|x-median| * 1.4826), mean, count} — 정규분포 std 일치 추정량 스케일"
    statistical_layer:
      source: model/detector.py:36-46,121-175
      rule: >-
        가맹점 baseline 이 있고 mad>0 이고 count>=3 이면 (median, mad) 로, 아니면 전역 (median, mad) 로
        robust z 계산(근거 문자열에 merchant/global 표기). z >= _Z_WARN(3.5) 부터 기여 시작해
        _Z_STRONG(6.0)에서 1.0 포화. 오프아워 00~04시 = 0.4. amount/merchant_mean >= 5.0 이면
        min(1, (ratio-5)/20 + 0.3). 세 성분의 max 를 취하고 2개 이상 발화 시 +0.15(상한 1.0)
    ml_layer:
      source: model/detector.py:85-118,187-205
      rule: >-
        IsolationForest(n_estimators=200, contamination=0.05, random_state=seed, n_jobs=1).
        fit 시 decision_function 의 min/max 를 정규화 경계로 저장. score 시 norm=(raw-lo)/span 를
        1-norm 으로 뒤집어 [0,1] 클램프. 추가로 predict == -1 이면 if_anomaly 를 최소 0.6 으로 끌어올리고
        'isolation-forest flagged multivariate outlier' 근거 추가
      guards: "fit 은 빈 records 에 ValueError. score 는 미적합 시 RuntimeError, 빈 records 는 빈 리스트"
    ensemble:
      source: model/detector.py:44-46,207-224
      rule: >-
        ensemble = 0.55*stat + 0.45*iforest. 양 계층이 각각 >= 0.5 면 +0.1(동의 보너스), [0,1] 클램프.
        isAnomaly = ensemble >= threshold(기본 0.7). 임계 초과인데 reasons 가 비면
        'ensemble score above threshold' 기본 근거 삽입. anomalyScore 는 소수 4자리 반올림
    service_lifecycle:
      source: service.py:18-78 + api/app.py:26-64
      rule: >-
        AnomalyService 는 생성 시 번들 샘플 데이터셋(seed 기반)을 만들어 보관. lifespan 에서
        ensure_trained() 로 cold-start 학습 → /score 가 기동 직후 동작. train(records=None)이면 번들 샘플 사용.
        demo() 는 번들 demo 셋(정상 8 + 주입 이상치 4)을 스코어링해 expectedOutliers 와 flagged 를 함께 반환
      sample: "가상 가맹점 5종(M-COFFEE 4.5천/M-GROCER 3.2만/M-ELECTRO 25만/M-BOOKS 1.8만/M-TRAVEL 48만) x 60건 + 고정 이상치 4건(금액스파이크·오프아워대액·음수·미지가맹점 950만)"
    api_contract:
      source: api/app.py:41-64 + schemas.py:9-52
      rule: "GET /health · POST /train(선택 records) · POST /score(records 필수) · GET /score/demo. RecordScore.anomalyScore 는 pydantic 이 [0,1] 강제. ScoreResponse 에 threshold 동봉"
    config:
      source: config.py:32-57
      rule: "frozen dataclass Settings — PORT(8121)·ANOMALY_THRESHOLD(0.7, [0,1] 검증)·ANOMALY_SEED(42)·ANOMALY_CONTAMINATION(0.05)·ANOMALY_N_ESTIMATORS(200)·LOG_LEVEL. 파싱 실패 env 는 기본값으로 강등"

  event_contracts:
    published: []
    consumed: []
    note: "순수 HTTP 스코어러 — 호출자가 레코드를 push 한다"

  acceptance_criteria:  # 실행 가능 — 각 AC 는 기존 게이트에 매핑
    - id: AC-1
      criterion: 피처 6종 산출·타임스탬프 폴백·MAD 스케일이 일치한다
      gate: "python3.11 -m pytest — tests/test_features.py"
    - id: AC-2
      criterion: 통계/ML 계층과 앙상블 블렌딩·임계 판정이 일치한다
      gate: "tests/test_detector.py"
    - id: AC-3
      criterion: API 계약과 데모의 주입 이상치 탐지가 일치한다
      gate: "tests/test_api.py"
    - id: AC-4
      criterion: Python 3.11 pytest GREEN
      gate: ".github/workflows/polyglot-ci.yml (Python 매트릭스)"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: >-
        ★ 환경변수가 프로세스당 1회만 읽힌다 — Settings 필드 기본값이 함수 호출(_get_int/_get_float)이라
        클래스 정의 시점에 한 번 평가된다. get_settings() 가 매번 새 인스턴스를 만들어도 값은 import 시점에 굳는다.
        독스트링의 'Not cached so tests can monkeypatch env vars and rebuild'(config.py:53-56)가 지켜지지 않는다.
        대조: forecast-service 의 load_settings() 는 호출 시마다 os.getenv 를 읽어 정상 동작
      disposition: recorded-not-fixed (medium — 문서/동작 불일치)
    - id: KI-2
      finding: >-
        ★ merchant_freq 가 학습·추론에서 의미가 다르다 — '이 배치 내 건수'라서 학습(가맹점당 60건)은 60,
        실사용(1~수 건 스코어링)은 1~3. IsolationForest 관점에서 모든 추론 레코드가 학습 분포 밖 값을 갖고,
        호출 배치 크기가 이상 점수를 좌우한다. baselines 는 학습 시점 통계를 쓰는데 이 피처만 배치 통계라 비대칭
      disposition: recorded-not-fixed (high — 피처 드리프트)
    - id: KI-3
      finding: "모델이 합성 데이터로만 학습 — sample_data.py 의 가상 가맹점 5종. 실 settlement_db 연동 경로가 없어, 실 정산 건을 스코어링하면 가맹점 기준선이 매칭되지 않아 전역 폴백으로만 동작한다(목표 G1 '절대 임계값 미사용'이 실질 무력화)"
      disposition: recorded-not-fixed (high)
    - id: KI-4
      finding: "POST /train 이 무인증으로 전역 모델을 교체한다 — 임의 요청 하나가 이후 모든 스코어링 기준선을 바꾼다. /score·/score/demo 도 무인증"
      disposition: recorded-not-fixed (medium)
    - id: KI-5
      finding: "모델이 프로세스 메모리 — uvicorn 워커/레플리카마다 학습 상태가 다르고 /train 은 받은 워커에만 적용된다. 같은 레코드가 워커에 따라 다른 점수를 받는다"
      disposition: by-design-with-consequence (무영속 MVP)
    - id: KI-6
      finding: "IsolationForest 정규화가 학습셋 min/max 클램프 — 학습 때보다 극단적인 레코드는 전부 1.0 으로 포화해 '매우 이상'과 '극도로 이상'을 구분하지 못한다"
      disposition: recorded-not-fixed (low)
    - id: KI-7
      finding: "호출자가 없다 — compose 정의·게이트웨이 라우트·호출 Java 서비스 모두 없음. operation-service 가 자체 이상탐지를 보유해 이 서비스는 실 트래픽을 받지 않는다"
      disposition: recorded-not-fixed (high — 미배선)
    - id: KI-8
      finding: "/metrics·카운터 없음 — 스코어링 건수·플래그율·학습 시점을 지표로 볼 수 없다"
      disposition: recorded-not-fixed (low)

  uses:
    - regression-baseline
    - interview-portfolio
    - brownfield-base
