# Seed: forecast-service 시계열 예측 as-is 사양 (Ouroboros 방법론 — Interview → Seed 결정화)
# 상태: CONFIRMED (기존 서비스 seed 와 동일 방식 지시로 승인 승계, 2026-08-13)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.

seed:
  id: forecast-service-timeseries-v1
  goal: >-
    forecast-service(Python/FastAPI 8122 — Holt-Winters 가법추세/조건부 가법계절 + seasonal-naive 폴백·
    잔차 기반 ±1.96σ 구간·표본내 MAPE/RMSE·관측 간격 추론)의 현행 동작을 실행 가능한 게이트에 매핑된
    불변 사양으로 결정화해, 회귀 기준선 · 면접/포트폴리오 문서 · 후속 실데이터 연동 베이스로 사용한다.

  scope:
    included:
      - 모델 2종과 폴백 체인 (짧은 시계열·적합 실패)
      - 예측 구간 산출 (잔차 std 기반 대칭 구간)
      - 지표 (MAPE 0 제외 규칙·RMSE)
      - 날짜 처리 (오름차순 강제·간격 추론·미래 날짜 생성)
      - API 표면 (health·forecast·demo)과 JSON 안전성 치환
    excluded:
      - 정산 실적 산출 (settlement-service 소관)
      - 화면 렌더링 (프론트)

  constraints:
    - "DB 없음 — 요청마다 적합, 모델 영속화 0"
    - "Kafka 의존 없음 — 이벤트 발행/소비 0"
    - "단변량만 — 외생변수(휴일 등) 미사용"
    - "시계열은 호출자가 싣는다 — 자동 수집 없음"
    - "Python 3.11 필수 — statsmodels/numpy 핀"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 forecast-service/src/forecast_service/)
    model_selection:
      source: models.py:69-157
      rule: >-
        build_forecaster: auto|holt_winters|holtwinters|hw → HoltWinters, seasonal_naive|naive|snaive → SeasonalNaive,
        그 외 ValueError. HoltWinters 는 trend='add' 고정, seasonal='add' 는 m>=2 이고
        n >= max(min_seasons*m + 1, 2*m + 1) 일 때만. n<4 면 시도 없이 seasonal-naive 폴백(로그).
        statsmodels 적합 예외도 seasonal-naive 폴백(warn). 응답 라벨 = holt_winters_seasonal | holt_winters_trend | seasonal_naive
      seasonal_naive: "m = season_period>=1 이면 그 값, 아니면 1. m = min(m, n). forecast[t] = last_season[t % m]. 표본내 fitted[t] = y[t-m] (t<m 이면 y[t]). m==1 이면 고전 naive 로 축약"
    interval:
      source: models.py:19-27
      rule: "±_Z_95(1.959963984540054) × 잔차 표준편차. resid_std 가 비유한(non-finite)하거나 <=0 이면 0 으로 처리 → 구간 폭 0. 전 horizon 에 동일 폭 적용(대칭·상수)"
    metrics:
      source: metrics.py:14-45
      rule: >-
        rmse = sqrt(mean((a-p)^2)). mape = mean(|a-p|/a) * 100 이되 actual==0 인 항은 제외,
        전부 0 이면 NaN. 길이 불일치·빈 배열은 ValueError. in_sample_metrics 는 두 값을 dict 로 반환
    date_handling:
      source: service.py:17-57 + app.py:46-51
      rule: >-
        요청 dates 가 sorted 와 다르면 422(정렬을 대신 해주지 않는다). _infer_step 은 dates[-1]-dates[-2]
        하나만 보고, days<=0 이거나 점이 1개면 1일. 미래 날짜 = last + step*(i+1). 예측/구간 값은 소수 6자리 반올림
    orchestration:
      source: service.py:33-92
      rule: >-
        길이 불일치·빈 시계열·horizon<1 은 ValueError(→ 422 매핑). fit_predict 후 fitted 와 actual 모두
        유한한 인덱스에서만 표본내 지표 계산, 유효 인덱스가 없으면 {mape:NaN, rmse:NaN}.
        ForecastResult(model 라벨, points, metrics_in_sample, fitted) 반환
    json_safety:
      source: app.py:25-27,84-100
      rule: "_sanitize 로 NaN/Inf 를 0.0 치환 — 'JSON has no NaN/Inf; coerce to 0.0 so the response stays valid' 주석 명문. yhat/lower/upper/mape/rmse 전부 적용"
    api_contract:
      source: app.py:40-79 + schemas.py:9-40
      rule: >-
        GET /health · POST /forecast · GET /forecast/demo(번들 CSV, horizon 14, seasonPeriod 7 고정).
        pydantic — series min_length 1, horizon 1..365, seasonPeriod 2..366(optional), model 기본 'auto'
      config: "load_settings() 가 호출 시마다 os.getenv 를 읽는다 — PORT(8122)·HOST(0.0.0.0)·LOG_LEVEL·MIN_SEASONS_FOR_SEASONAL(2)"
      demo_data: "data/demo_settlement_daily.csv 가 있으면 로드, 없으면 시드 42 로 생성(120일, 기저 100000 + 1500*t 추세 + 주말 -25000/-40000 계절 + N(0,3000) 잡음, 0 하한)"

  event_contracts:
    published: []
    consumed: []
    note: "순수 계산 API — 시계열은 요청 본문 또는 번들 데모 CSV 에서만 온다"

  acceptance_criteria:  # 실행 가능 — 각 AC 는 기존 게이트에 매핑
    - id: AC-1
      criterion: MAPE 0 제외 규칙·RMSE·에러 조건이 일치한다
      gate: "python3.11 -m pytest — tests/test_metrics.py"
    - id: AC-2
      criterion: 모델 선택·폴백 체인·seasonal-naive 반복 규칙이 일치한다
      gate: "tests/test_models.py"
    - id: AC-3
      criterion: 오케스트레이션(간격 추론·미래 날짜·표본내 지표·backtest_split)이 일치한다
      gate: "tests/test_service.py"
    - id: AC-4
      criterion: API 계약(422 조건·데모 응답 shape)이 일치한다
      gate: "tests/test_api.py"
    - id: AC-5
      criterion: Python 3.11 pytest GREEN
      gate: ".github/workflows/polyglot-ci.yml (Python 매트릭스)"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: >-
        ★ 예측 구간이 horizon 에 따라 넓어지지 않는다 — _interval 이 단일 잔차 std 로 전 구간에 같은 폭을 적용
        (models.py:22-27). 1일 뒤와 14일 뒤 불확실성이 동일하게 표시돼 장기 구간의 신뢰도를 체계적으로 과대평가한다.
        자금계획 근거로 쓰면 위험한 형태
      disposition: recorded-not-fixed (high — 통계적 부정확)
    - id: KI-2
      finding: >-
        ★ NaN → 0.0 치환이 실패를 성공처럼 보이게 한다 — mape 는 실측이 전부 0일 때 의도적으로 NaN 을 반환하는데
        (metrics.py:38-39) 응답에서는 mape: 0.0 = '완벽한 예측'으로 읽힌다. 예측값도 NaN→0.0 이라
        '0원 예측'과 '계산 실패'를 구분할 수 없다
      disposition: recorded-not-fixed (medium — 오도 표현)
    - id: KI-3
      finding: "service.backtest_split(표본 밖 MAPE/RMSE)이 구현돼 있으나 어떤 엔드포인트도 호출하지 않는다 — API 지표는 전부 표본내라 과적합을 감지할 수 없는데, 감지할 코드는 이미 있고 사문화돼 있다"
      disposition: recorded-not-fixed (medium — 사문화된 기능)
    - id: KI-4
      finding: "_infer_step 이 마지막 두 점만 본다(service.py:22-26) — 일간 시계열이라도 마지막 두 점이 3일 떨어져 있으면 미래 날짜 전부가 3일 간격이 된다. 결측·불규칙 구간이 있는 실데이터에서 조용히 틀린 날짜를 만든다"
      disposition: recorded-not-fixed (medium)
    - id: KI-5
      finding: "데이터 소스 미연동 — settlement 실 정산액을 끌어오는 경로가 없다(N1 은 비목표 선언). 데모는 demo_data.py 가 만든 합성 시계열이라, 데모의 정확도는 '모델이 자기가 만든 패턴을 맞춘 것'에 가깝다"
      disposition: by-design-with-consequence
    - id: KI-6
      finding: "계절 폴백이 조용하다 — 주기를 명시했는데 표본 부족으로 추세 전용으로 내려갈 때 로그가 없다(n<4 폴백·적합 실패는 로그 있음). 응답 model 라벨로만 유추 가능"
      disposition: recorded-not-fixed (low)
    - id: KI-7
      finding: "호출자·배선·인가 전무 — compose 정의, 게이트웨이 라우트, 호출 Java 서비스·프론트 코드 모두 없고 3개 엔드포인트 무인증. CEO 대시보드가 이 서비스를 쓰는 배선은 존재하지 않는다"
      disposition: recorded-not-fixed (high — 미배선)
    - id: KI-8
      finding: "/metrics·카운터 없음 — 요청량·모델 선택 분포·폴백 발생률을 지표로 볼 수 없다"
      disposition: recorded-not-fixed (low)

  uses:
    - regression-baseline
    - interview-portfolio
    - brownfield-base
