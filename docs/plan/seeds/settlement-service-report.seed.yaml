# Seed: settlement-service 리포트 as-is 사양 (캐시플로우·매출통계·기간 대사)
# 상태: CONFIRMED (역산 결정화, 2026-08-23)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.
# 자매 Seed: settlement-service-accounting-core · -tax · -recovery · -closing-integrity
# 위치: 2026-08-22 감사의 R2-5 로 남았던 마지막 슬라이스. 이 문서로 settlement 10슬라이스가 전부 Seed 범위 안에 들어온다.

seed:
  id: settlement-service-report-v1
  goal: >-
    settlement-service 리포트 슬라이스(기간 캐시플로우 집계·PDF·매출 통계 축별 구성비·전기 대비·
    리포트 기간 대사 3종)의 현행 동작을 실행 가능한 게이트에 매핑된 불변 사양으로 결정화해,
    회귀 기준선 · 표시 규약(반올림·스케일·null 의미) 드리프트 방지 · 면접/포트폴리오 문서로 사용한다.

  character: >-
    읽기 전용 슬라이스다 — 상태를 바꾸는 경로가 없다. 그래서 위험이 '금액을 잘못 움직이는 것'이 아니라
    '같은 데이터를 두 화면이 다르게 말하는 것'에 있다. 불변식 대부분이 "누가 계산하고 누가 반올림하는가"를
    못 박는 이유가 그것이다.

  scope:
    included:
      - 기간 규약(366일 상한·반개구간·직전 기간 정의)
      - 표시 규약(스케일·반올림·null 의미·구성비 합)
      - 축별 집계 5종과 SQL 주입 차단 방식
      - 리포트 기간 대사 3종과 실패 알림 경로
      - 캐시플로우 PDF 산출
    excluded:
      - 정산·지급·원장 도메인 규칙 (settlement-service-accounting-core Seed 소관)
      - 프로젝션 뷰 적재·백필 (projection-view-ops 스킬)
      - 정합성 스위트 8종 (settlement-service-closing-integrity Seed 소관)
      - PDF 렌더링 라이브러리 내부 (iText)

  constraints:
    - "읽기 전용 — @Transactional(readOnly = true), 상태 변경 경로 0"
    - "집계 축은 enum 고정 — 컬럼명을 문자열로 받지 않는다(SQL 주입 차단)"
    - "구성비·정렬·증감률은 도메인이 계산 — 화면이 나누면 반올림 규칙이 화면 수만큼 생긴다"
    - "MSA 경계(ADR 0020) — settlements + 로컬 프로젝션만 읽는다, order 원천 직접 조회 0"
    - "도메인 규칙 위반은 ReportDomainException 계열로 — generic IAE 금지"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 settlement-service/src/main/java/github/lms/lemuel/report/)
    period_max_days:
      source: domain/ReportPeriod.java:9-12,20,32-35
      rule: "조회 가능 최대 366일(양 끝 포함). 초과 시 InvalidReportPeriodException"
      rationale: "제한이 없으면 연도 오타 한 번(2026 -> 2016)이 전 기간 스캔이 되어 운영 DB 를 물고 늘어진다. 366 은 윤년 1년이라 연간 리포트가 경계에 딱 맞는다"
    period_validation:
      source: domain/ReportPeriod.java:24-31,60-62
      rule: "from/to null·역전 거부. 일수는 양 끝 포함(between + 1)"
    previous_period_definition:
      source: domain/ReportPeriod.java:14-17,55-58
      rule: "직전 기간 = 같은 길이를 바로 앞에 붙인 것. 1월(31일)의 직전은 12월(31일)이지 '지난달'이 아니다"
      rationale: "달 길이가 들쭉날쭉해 비교가 흔들리는 것보다 길이를 고정하는 편이 읽기 쉽다"
      constructor_bypass: "previous() 는 검증 팩토리가 아니라 정본 생성자를 직접 쓴다 — 상한 검증이 내부 파생까지 막지 않게(주석 명문)"
    half_open_interval:
      source: domain/ReportPeriod.java:51-52
      rule: "endExclusive() 가 종료 다음 날을 준다 — SQL 은 settlement_date < ? 로 쓴다"
    growth_rate_null_on_zero_denominator:
      source: domain/SalesComparison.java:9-19,45-52
      rule: "직전 값이 0 이면 증감률은 null. 이 한 줄이 SalesComparison 의 존재 이유다"
      why:
        - "0% 로 답하면 '변화 없음'으로 읽혀 정반대의 사실을 전한다 — 실제로는 0에서 매출이 생긴 것이다"
        - "무한대·큰 수로 답하면 화면의 축이 무너진다"
        - "'비교할 직전 값이 없다'는 숫자가 아니라 상태라서 null 로 넘겨 화면이 대시(—)로 그리게 한다"
      per_axis: "축(거래액·순정산액·건수)마다 분모가 달라 판정도 축별로 따로 한다"
    two_different_scales:
      rule: "증감률과 구성비의 스케일 규약이 다르다 — 이 슬라이스에서 가장 헷갈리는 지점"
      growth_rate: "소수 4자리(0.0000 = 0%, 1.0000 = +100%). 백분율 변환은 화면 몫 (SalesComparison.java:22,25)"
      share_percent: "0~100 스케일로 서버가 표시 단위를 확정(75.00, 0.75 아님) — 화면이 다시 100 을 곱하지 않도록 (domain/SalesShare.java:6-10)"
    share_computed_in_domain:
      source: domain/SalesBreakdown.java:14-18,21-22,44-45
      rule: "구성비는 도메인이 소수 2자리 반올림으로 계산. 분모 0 이면 0(전 구간 0원인 기간에서 나눗셈으로 터지지 않는다)"
      rationale: "화면에서 나누면 반올림 규칙이 화면 수만큼 생긴다"
      sum_not_forced_to_100: "합이 정확히 100.00 이 아닐 수 있고 그건 정상이다(33.33 x 3 = 99.99). 억지로 맞추려 잔여를 특정 구간에 몰아주면 그 구간만 실제와 다른 값을 갖는다"
    sort_in_domain:
      source: domain/SalesBreakdown.java:11-13,35-37
      rule: "거래액 내림차순 + 동점은 라벨로 확정"
      rationale: "SQL ORDER BY 에 맡기면 축을 늘릴 때마다 순서 규칙이 따로 생기고 실행계획이 바뀌면 동점 구간의 순서가 흔들린다"
    unknown_label:
      source: domain/SalesSlice.java:11-13,20,22
      rule: "라벨이 null·공백이면 UNKNOWN 으로 고정 — payment_method 가 NULL 인 옛 결제가 실제로 있고 그대로 흘리면 화면에 빈 칸이 생긴다"
    refund_rate:
      source: domain/CashflowTotals.java:16-17,34-36
      rule: "refundRate = refundedAmount / gmv, 소수 4자리 HALF_UP, gmv = 0 이면 0"
    report_compact_constructor:
      source: domain/CashflowReport.java:17-34
      rule: "buckets null -> 빈 목록 · totals null -> 버킷 합으로 파생 · reconciliation null -> empty(). from > to 는 여기서도 거부"
    granularity_parsing:
      source: domain/BucketGranularity.java:12-23
      rule: "null·blank -> DAY, 미지원 값 -> ReportInvariantViolationException (IllegalArgumentException 을 감싸 도메인 예외 계열 유지)"
    dimension_enum_blocks_injection:
      source: domain/SalesDimension.java:6-8 + adapter/out/persistence/SalesStatsJdbcAdapter.java:118-126
      rule: "집계 축을 enum 으로 고정 — 집계 컬럼을 문자열로 받으면 그 자리가 곧 주입 지점이 된다. 열거된 5개 밖의 값은 애초에 어댑터에 도달하지 못하고, 어댑터 switch 가 축->컬럼을 상수로 매핑한다"
      dimensions: "PAYMENT_METHOD · SELLER_TIER · SETTLEMENT_STATUS (구성비) / SELLER · PRODUCT (랭킹)"
      why_not_two_types: "계산은 같으므로 타입은 나누지 않고 상위 N 클램프만 서비스가 공통으로 건다 (SalesDimension.java:10-12)"
    limit_clamp:
      source: application/service/SalesStatsService.java:37-38,58-60
      rule: "상위 N 은 1~100 클램프, 0·음수는 1 로 올린다 — LIMIT 0 은 오류 없이 빈 화면을 만들어 '데이터가 없다'로 오독된다"
    service_owns_previous_period:
      source: application/service/SalesStatsService.java:22-24,44-46
      rule: "직전 기간은 서비스가 ReportPeriod.previous() 로 스스로 잡는다 — 화면이 분모를 넘기게 두면 화면마다 '전기'의 정의가 달라져 같은 데이터에서 다른 증감률이 나온다. 호출 순서가 곧 비교의 방향(현재가 분자)"
    msa_boundary_projections_only:
      source: adapter/out/persistence/SalesStatsJdbcAdapter.java:14-19
      rule: "settlements + settlement 소유 프로젝션(settlement_{payment,order,product,user}_view)만 읽는다 — settlement_db 단독으로 대시보드가 성립한다 (ADR 0020)"
    left_join_only:
      source: adapter/out/persistence/SalesStatsJdbcAdapter.java:21-25
      rule: >-
        전부 LEFT JOIN. 프로젝션은 이벤트로 따라오므로 잠깐 비어 있을 수 있는데 INNER JOIN 이면
        그 사이의 정산이 집계에서 조용히 사라져 합계가 /api/reports/cashflow 와 어긋난다.
        LEFT JOIN 이면 라벨만 비고(UNKNOWN) 금액은 남는다 — 없는 척하는 것보다 모른다고 말하는 편이 정직하다.
    totals_bypass_projections:
      source: adapter/out/persistence/SalesStatsJdbcAdapter.java:27-29
      rule: "totals 는 settlements 단독 집계라 프로젝션 지연과 무관하게 항상 캐시플로우 리포트와 같은 값을 낸다"
    unified_date_axis:
      source: adapter/out/persistence/SalesStatsJdbcAdapter.java:31-32
      rule: "날짜 축은 settlement_date 로 통일 — 캐시플로우 리포트와 같은 축이라야 두 화면이 같은 말을 한다"
    reconciliation_checks:
      source: application/service/GenerateCashflowReportService.java:30-35,97-113
      checks:
        - "payments_minus_refunds_equals_settlement — Σ(결제 − 환불) = Σ(정산 net + commission), 결제→정산 금액 보존"
        - "adjustments_equal_linked_refunds — |Σ조정| = Σ(조정에 연결된 환불), 조정·환불 원장 정합성"
        - "outbox_published_equals_settlements_created — count(outbox PaymentCaptured PUBLISHED) = count(정산 생성), 이벤트 파이프라인 원자성"
      matched_semantics:
        source: domain/CashflowReconciliation.java:6-10,17-24
        rule: "matched 는 모든 개별 체크가 통과한 경우에만 true — 하나라도 실패하면 금액이 샜다는 의미라 Alertmanager 연계 대상"
      no_tolerance:
        source: domain/ReconciliationCheck.java:24-29
        rule: "통과 판정은 expected − actual == 0 (compareTo). 허용 오차 없음, 차이는 discrepancy 로 함께 남는다"
      seller_scope_skips:
        source: application/service/GenerateCashflowReportService.java:76-79
        rule: "셀러 스코프 조회는 대사를 건너뛴다 — 시스템 전체 불변식이라 판매자 단위에는 의미가 없다. empty()(matched=true, checksRun=0) 반환"
    mismatch_alerting:
      source: application/service/GenerateCashflowReportService.java:31,81-92
      rule: "불일치 시 ERROR 로그 + 실패한 체크마다 check 태그를 단 Counter 증가(cashflow_reconciliation_mismatch_total). Alertmanager 가 rate(...[1h]) > 0 으로 감시"
    latency_timer:
      source: application/service/GenerateCashflowReportService.java:27,46-52
      rule: "cashflow_report_generation_duration_seconds, p50/p95/p99. Timer 는 한 번 만들어 재사용(반복 호출 시 MeterRegistry 조회 비용 제거)"
    audit_on_cashflow:
      source: application/service/GenerateCashflowReportService.java:56-61
      rule: "@Auditable(CASHFLOW_REPORT_ACCESSED) 에 기간·granularity·sellerId 기록"

  rest_surface:
    authorization: "shared-common/.../SecurityConfig.java:250 — /api/reports/** 는 hasAnyRole(ADMIN, MANAGER)"
    endpoints:
      - "GET /api/reports/cashflow — 기간 캐시플로우 + 대사 3종 (ReportController.java:32,39)"
      - "GET /api/reports/cashflow/pdf — application/pdf, attachment (ReportController.java:51)"
      - "GET /api/reports/sellers/{sellerId}/cashflow — 판매자별, 대사는 빈 값 (ReportController.java:75)"
      - "GET /api/reports/sales-stats/summary — 기간 합계 + 전기 대비 (SalesStatsController.java:42,54)"
      - "GET /api/reports/sales-stats/breakdown — 축별 구성비 상위 N (SalesStatsController.java:71)"
    error_mapping: "400(잘못된 groupBy·필수 파라미터 누락)은 shared-common GlobalExceptionHandler 로 일원화 (ReportController.java:93-94 주석)"

  event_contracts:
    publishes: []
    consumes: []
    note: "읽기 전용 슬라이스 — 이벤트 표면 없음"

  acceptance_criteria:
    - id: AC-1
      criterion: 366일 초과·기간 역전이 거부된다
      gate: "./gradlew :settlement-service:test — ReportPeriodTest"
    - id: AC-2
      criterion: 직전 기간이 '같은 길이 바로 앞'으로 계산된다
      gate: "ReportPeriodTest"
    - id: AC-3
      criterion: 분모 0 에서 증감률이 0 이 아니라 null 이다
      gate: "SalesComparisonTest"
    - id: AC-4
      criterion: 구성비가 0~100 스케일·소수 2자리이고 합이 100 이 되도록 보정되지 않는다
      gate: "SalesBreakdownTest"
    - id: AC-5
      criterion: 동점 구간 정렬이 라벨로 확정된다
      gate: "SalesBreakdownTest"
    - id: AC-6
      criterion: 빈 라벨이 UNKNOWN 으로 고정된다
      gate: "SalesBreakdownTest"
    - id: AC-7
      criterion: 상위 N 이 1~100 으로 클램프된다(0 -> 1)
      gate: "SalesStatsServiceTest"
    - id: AC-8
      criterion: 미지원 groupBy 가 도메인 예외로 거부된다
      gate: "BucketGranularityTest"
    - id: AC-9
      criterion: 합계·환불률이 버킷 합에서 파생된다(gmv=0 -> 0)
      gate: "CashflowTotalsTest · CashflowReportTest"
    - id: AC-10
      criterion: 대사 3종이 전부 통과해야 matched 다
      gate: "CashflowReconciliationTest"
    - id: AC-11
      criterion: 불일치 시 체크별 Counter 가 증가한다
      gate: "GenerateCashflowReportServiceTest"
    - id: AC-12
      criterion: 셀러 스코프 조회가 대사를 건너뛴다
      gate: "GenerateCashflowReportServiceTest · ReportControllerTest"
    - id: AC-13
      criterion: PDF 가 application/pdf + attachment 로 나간다
      gate: "ReportControllerPdfTest · CashflowPdfAdapterTest"
    - id: AC-14
      criterion: /api/reports/** 가 ADMIN·MANAGER 로 제한된다(미인증 401 · USER 403 · ADMIN/MANAGER 통과)
      gate: "./gradlew -p shared-common test — SecurityAuthorizationMatrixTest"
      note: "Seed 작성 시점에는 게이트가 없어 UNMET 이었다(KI-7). 2026-08-23 신설 — 실제 springSecurityFilterChain 에 요청을 흘려 상태코드로 판정을 읽으므로 매처 삭제와 순서 변경을 모두 잡는다"
    - id: AC-15
      criterion: 모든 인바운드 포트가 어댑터에서 도달 가능하다
      gate: "InboundPortReachabilityTest (ArchUnit)"
    - id: AC-16
      criterion: 커버리지 LINE >= 90%
      gate: "./gradlew :settlement-service:jacocoTestCoverageVerification"

  test_assets:
    total_classes: 13
    domain: "ReportPeriodTest · SalesComparisonTest · SalesBreakdownTest · CashflowTotalsTest · CashflowReportTest · CashflowReconciliationTest · BucketGranularityTest"
    service: "GenerateCashflowReportServiceTest · SalesStatsServiceTest"
    controller: "ReportControllerTest · ReportControllerPdfTest · SalesStatsControllerTest"
    adapter: "CashflowPdfAdapterTest"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: >-
        셀러 축 라벨이 셀러 이메일 원문이다 — SalesDimension.SELLER 의 라벨은
        COALESCE(MAX(uv.email), 'seller#' || pv.seller_id) 로 프로젝션에 이메일이 있으면 그대로 응답에 실린다
        (SalesStatsJdbcAdapter.java:122-123). 응답 DTO 에도 마스킹이 없다(dto/SalesBreakdownResponse.java:29,37).
        ADMIN·MANAGER 전용이라 무인증 노출은 아니지만 프로젝트의 PII 마스킹 규율과는 어긋난다.
      disposition: recorded-not-fixed (마스킹 적용 후보 — 셀러 식별은 seller#{id} 로도 성립한다)
    - id: KI-2
      finding: >-
        감사로그가 두 경로에서 비대칭이다 — 캐시플로우는 @Auditable(CASHFLOW_REPORT_ACCESSED)로 남지만
        매출 통계(/sales-stats/**)에는 @Auditable 이 없다(SalesStatsService.java 전체).
        그런데 SELLER 축 조회는 셀러별 거래액 랭킹을 그대로 드러낸다 — 민감도가 캐시플로우보다
        낮지 않은데 누가 봤는지 기록이 없다.
      disposition: recorded-not-fixed (감사 범위 격차)
    - id: KI-3
      finding: >-
        대사가 '누군가 리포트를 열 때'만 돈다 — 대사 3종은 generate() 안에서 실행되므로 아무도
        캐시플로우를 조회하지 않으면 금액 누수가 감지되지 않는다. report 슬라이스에 @Scheduled 는 0건이고,
        월마감·정합성 Seed 의 일일 모니터(06:00)는 이 3종을 돌리지 않는다.
      disposition: recorded-not-fixed (③ 발동 층 격차 — closing-integrity KI-1 과 같은 결)
    - id: KI-4
      finding: >-
        대사 #3 은 짧은 기간에서 거짓 불일치가 날 수 있다 — count(outbox PUBLISHED) = count(정산 생성)은
        경계 시각 오차가 있어 코드 주석이 월 단위 기간을 권장한다(GenerateCashflowReportService.java:104-106).
        그러나 기간 조건이 없어 하루 조회에서도 그대로 돌고 Counter 를 올린다. Alertmanager 가 rate > 0 으로
        감시하므로 짧은 기간 조회 한 번이 알림을 만들 수 있다.
      disposition: recorded-not-fixed (임계·기간 조건 부재)
    - id: KI-5
      finding: >-
        PDF 경로가 컨트롤러에서 아웃포트를 직접 부른다 — ReportController 가 RenderCashflowReportPdfPort
        (= application.port.out)를 주입받아 호출한다(ReportController.java:6,37,60). 현행 ArchUnit 은
        domain -> application/adapter 와 application -> adapter 만 막고 adapter.in -> application.port.out 은
        막지 않아 통과한다. 실질 피해는 없으나(감사·집계는 generate() 를 먼저 타므로 그대로 적용된다)
        PDF 조립 책임이 애플리케이션 계층에 없다.
      disposition: recorded-not-fixed (구조 일관성 — 규칙을 늘릴지 결정 사항)
    - id: KI-6
      finding: >-
        /sellers/{sellerId}/cashflow 는 이름과 달리 셀러가 못 쓴다 — /api/reports/** 가 ADMIN·MANAGER 라
        이 경로는 운영자가 특정 셀러를 들여다보는 용도다. 셀러 자가 조회 경로는 이 슬라이스에 없다.
        경로명이 소유자 기반 접근을 시사해 IDOR 대조가 있는 것으로 오독되기 쉽다(실제로는 대조 코드가 없고 필요도 없다).
      disposition: by-design-documented (셀러 자가 리포트가 생기면 그때 IDOR 대조가 필요해진다)
    - id: KI-7
      finding: >-
        역할 제한에 회귀 가드가 없다 — /api/reports/** = ADMIN·MANAGER 는 SecurityConfig.java:250 한 줄에만
        있고 이를 어서트하는 테스트가 리포트 쪽에도 shared-common 쪽에도 없었다.
      resolution: >-
        2026-08-23 shared-common/src/test/.../SecurityAuthorizationMatrixTest 신설로 해소.
        실제 필터 체인에 요청을 흘려 리포트 5경로에 대해 미인증 401 · USER 403 · ADMIN/MANAGER 통과를 확인한다.
        RED 를 목격하고 세운 게이트다 — 매처 한 줄을 지우면 USER 가 403 이 아니라 200 을 받는다
        (anyRequest().authenticated() 로 새는 실패 모드 그대로). 정적 grep 으로는 순서 변경을 볼 수 없어
        판정을 직접 읽는 방식을 골랐다.
      disposition: resolved

  uses:
    - regression-baseline
    - interview-portfolio
