# Seed: settlement-service 월마감·정합성 as-is 사양
# 상태: CONFIRMED (역산 결정화, 2026-08-22)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.
# 자매 Seed: settlement-service-accounting-core · -tax · -recovery (closing·integrity 는 회계 코어 범위 밖이었다, 감사 R-2)

seed:
  id: settlement-service-closing-integrity-v1
  goal: >-
    settlement-service 의 기간 단위 검증(정합성 스위트 8종)과 기간 확정(월마감 run·재마감 잠금)의
    현행 동작을 실행 가능한 게이트에 매핑된 불변 사양으로 결정화한다.

  why_one_seed: >-
    둘 다 개별 정산 1건이 아니라 기간 전체를 대상으로 하는 사후 검증이다. integrity 는
    "지금 데이터가 서로 맞는가"를 매일 묻고, closing 은 "이 달은 이제 안 바뀐다"를 선언해 잠근다.
    잠그기 전에 맞는지 봐야 하고 잠근 뒤에는 틀린 것을 고칠 수 없다 — 같은 축 위의 앞뒤 단계다.

  scope:
    included:
      - 마감 run 상태머신과 재시도 규약(새 run 생성)
      - 재마감 잠금 조건(원장 CLOSED x 마트 존재)
      - 마감 대상 기간 제약(완결된 과거 월만)
      - 정합성 리포트 8종과 일일 모니터 배치
    excluded:
      - 원장 기간(ledger_periods) 자체의 개폐 규칙 (settlement-service-accounting-core 소관)
      - 정산·지급·원장 도메인 규칙 (동상)
      - 대사 불일치의 원인 분류 (recon-playbook 스킬)
      - MCP 도구 표면 (운영 도구, 코드 밖)

  constraints:
    - "마감 run 은 팩토리 전용·setter 없음, 영속 복원은 rehydrate 전용(검증 재실행 없음)"
    - "배치는 분산 락(@SchedulerLock)을 건다 — 다중 인스턴스 중복 실행 금지"
    - "정합성 조회는 읽기 전용 — 도메인 상태를 바꾸지 않는다"
    - "프로젝션 대사는 order 내부 API 호출로만 — cross-DB 조인 0 (ADR 0020)"
    - "도메인 규칙 위반은 ClosingInvariantViolationException / InvalidClosingRunStateException 으로"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 settlement-service/src/main/java/github/lms/lemuel/)
    run_state_machine:
      source: closing/domain/ClosingRunStatus.java:4-7,13-16
      rule: "RUNNING -> COMPLETED | FAILED, 둘 다 종결. 실패한 마감의 재시도는 상태 재개가 아니라 새 run 생성(기간당 최신 run upsert)"
    past_month_only:
      source: closing/domain/MonthlyClosingRun.java:80-83
      rule: "period 가 currentMonth 보다 앞서지 않으면 ClosingInvariantViolationException — 당월·미래월 마감이 도메인에서 막힌다"
    reclose_lock:
      source: closing/application/service/RunMonthlyClosingService.java:28-30
      rule: >-
        원장 기간이 CLOSED 이고 COMPLETED 마트가 이미 있으면 MonthlyClosingLockedException 으로 거부 —
        회계 확정 후 보고 수치 변조 방지. 원장이 CLOSED 라도 마트가 없으면 최초 적재는 허용한다.
    complete_takes_totals:
      source: closing/domain/MonthlyClosingRun.java:109-119
      rule: "complete() 가 셀러 수·정산 건수·미매핑 건수·대기 건수와 ClosingTotals 를 함께 받아 1회 갱신. 음수 건수 거부"
    rehydrate_no_revalidation:
      source: closing/domain/MonthlyClosingRun.java:89-90
      rule: "영속 복원은 저장된 상태를 그대로 재구성 — 과거 규칙으로 통과한 레코드가 규칙 변경으로 되살아나지 않는다"
    write_once_id:
      source: closing/domain/MonthlyClosingRun.java:143-145
      rule: "id 는 1회만 부여, 재부여는 IllegalStateException (write-once 인프라 가드라 도메인 예외 계열이 아니다)"
    closing_batch:
      source: closing/adapter/in/batch/MonthlyClosingScheduler.java:42-44,47-60
      cron: "매월 1일 04:30 Asia/Seoul — 직전 월 마감"
      lock: "@SchedulerLock(name = settlement-monthly-closing, lockAtMostFor = PT30M)"
      locked_is_success: "MonthlyClosingLockedException 은 로그만 남기고 스킵 — 이미 확정된 기간이라 재적재가 불필요하다"
      failure_policy: "실패는 다음 달 재시도가 아니라 운영자 콘솔 재실행에 맡긴다. FAILED run 이 감사 기록으로 남는다 — 자동 재시도가 조용히 수치를 바꾸지 않게"
      audit: "AuditAction.MONTHLY_CLOSING_EXECUTED 에 기간·상태·셀러 수·정산 건수·미매핑 건수를 JSON 으로 기록"
    integrity_reports:
      source: integrity/domain/
      count: 8
      names: "LedgerCompletenessReport · PayoutReconReport · PayoutBounceReconReport · HoldbackStatusReport · StuckStateReport · RefundAdjustmentReport · ProcessedEventCount · ProjectionDiffReport"
    jdbc_read_only:
      source: integrity/adapter/out/persistence/IntegrityQueryJdbcAdapter.java
      rule: "JPA 애그리거트를 거치지 않고 JDBC 로 직접 집계 — 검증 쿼리는 도메인 상태를 바꾸지 않는 읽기 전용"
    projection_recon_via_order_api:
      source: integrity/adapter/out/recon/{OrderPaymentKeysAdapter,OrderCompletedRefundsAdapter}.java
      rule: "order 내부 대사 API 호출 — 양측이 자기 DB 만 읽는다. cross-DB 조인 0 (ADR 0020 경계 유지)"
    checksum_comparison:
      source: integrity/application/port/out/KeyChecksum.java
      rule: "전건 목록을 주고받는 대신 요약값(체크섬)을 비교해 대사 비용을 상수로 만든다"
    integrity_monitor_batch:
      source: integrity/adapter/in/batch/IntegrityMonitorScheduler.java:50-53
      cron: "매일 06:00 Asia/Seoul — 전날 기준"
      lock: "@SchedulerLock(name = settlement-integrity-monitor, lockAtMostFor = PT15M)"
      note: "월마감(04:30)보다 늦다 — 마감 결과까지 포함해 본다는 뜻이다(known_issues KI-1 과 직결)"
    admin_surface:
      source: integrity/adapter/in/web/IntegrityAdminController.java:34,48-104
      rule: "/admin/integrity/{ledger-completeness, payout-recon, payout-bounce-recon, holdback-status, stuck, refund-adjustments, processed-count, projection-diff} — ADMIN 전용 8경로"

  event_contracts:
    publishes: []
    consumes: []
    note: "두 슬라이스 모두 이벤트 표면이 없다 — 검증·확정은 자기 DB 안에서 끝난다"

  acceptance_criteria:
    - id: AC-1
      criterion: 당월·미래월 마감이 거부된다
      gate: "./gradlew :settlement-service:test — MonthlyClosingRunTest"
    - id: AC-2
      criterion: 원장 CLOSED + 마트 존재일 때만 재마감이 잠긴다(마트 없으면 최초 적재 허용)
      gate: "RunMonthlyClosingServiceTest"
    - id: AC-3
      criterion: RUNNING 외 상태에서 complete·fail 이 거부된다
      gate: "MonthlyClosingRunTest · ClosingRunStatusTest"
    - id: AC-4
      criterion: 음수 집계 건수가 거부된다
      gate: "MonthlyClosingRunTest"
    - id: AC-5
      criterion: 잠긴 기간이 배치를 실패시키지 않는다(정상 스킵)
      gate: "RunMonthlyClosingServiceTest — MonthlyClosingLockedException"
    - id: AC-6
      criterion: 마감 결과가 영속·조회된다
      gate: "MonthlyClosingPersistenceAdapterTest · GetMonthlyClosingServiceTest · SellerMonthlyClosingTest"
    - id: AC-7
      criterion: 정합성 리포트 8종이 기대한 수치를 낸다
      gate: "IntegrityReportsTest · IntegrityAdminControllerTest · IntegrityPhaseA/B/C IntegrationTest"
    - id: AC-8
      criterion: 프로젝션 대사가 cross-DB 조인 없이 수행된다
      gate: "ProjectionReconciliationServiceTest · ProjectionDiffReportTest · ArchUnit MSA 경계"
    - id: AC-9
      criterion: 배치가 분산 락을 건다(다중 인스턴스 중복 실행 0)
      gate: "node --test scripts/harness/test/scheduler-lock-gate.test.mjs"
    - id: AC-10
      criterion: 모든 인바운드 포트가 어댑터에서 도달 가능하다
      gate: "InboundPortReachabilityTest (ArchUnit)"
    - id: AC-11
      criterion: 일일 모니터가 전날 기준으로 검사를 돌린다
      gate: "IntegrityMonitorSchedulerTest"
    - id: AC-12
      criterion: 커버리지 LINE >= 90%
      gate: "./gradlew :settlement-service:jacocoTestCoverageVerification"

  test_assets:
    total_files: 14
    closing: 6
    integrity: 8
    integration_names: "IntegrityPhaseAIntegrationTest · IntegrityPhaseBIntegrationTest · IntegrityPhaseCIntegrationTest"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: >-
        정합성 검사가 판정만 하고 아무것도 막지 않는다 — 8종 리포트는 조회 표면과 일일 로그로만
        존재하며 불일치가 발견돼도 마감을 막지 않는다. 마감(04:30)이 모니터(06:00)보다 먼저 돌기
        때문에 순서상으로도 막을 수 없다. 그날의 불일치는 이미 잠긴 기간에 대한 보고가 된다.
      disposition: recorded-not-fixed (설계 판단 지점 — 마감 전 게이트로 승격할 후보)
    - id: KI-2
      finding: "FAILED 마감의 재실행이 사람 손에 달려 있다 — 자동 재시도를 하지 않는 것은 의도지만 아무도 콘솔을 열지 않으면 그 달은 마감되지 않은 채 지나간다. 미마감 기간을 알리는 경로가 없다"
      disposition: recorded-not-fixed (알림 후보)
    - id: KI-3
      finding: "MonthlyClosingRun.assignId 만 generic IllegalStateException(MonthlyClosingRun.java:145) — closing 도메인은 타입 예외 계열을 쓰는데 여기만 다르다. 다만 write-once 인프라 가드는 IllegalStateException 을 쓴다는 프로젝트 규약이 있어(guard.mjs OO-DOMAIN-GENERIC-IAE 주석) 규칙 충돌은 아니다"
      disposition: by-design-documented
    - id: KI-4
      finding: "정합성 리포트에 임계·판정이 없다 — 리포트는 수치를 돌려줄 뿐 '이 정도면 이상'이라는 기준이 코드에 없다. 판단은 사람이나 MCP 도구(settlement-copilot) 쪽에 있어 같은 수치를 두 곳이 다르게 해석할 여지가 남는다"
      disposition: recorded-not-fixed (임계의 정본 부재)
    - id: KI-5
      finding: "마감 마트와 원장 기간이 서로 다른 잠금 주체다 — 재마감 잠금은 두 값을 동시에 봐야 성립하는데 두 상태를 한 트랜잭션이 소유하지 않는다. 원장 기간이 열려 있는 동안 마트만 재적재되는 조합이 성립하며 그때의 정합성은 이 Seed 범위에서 확인되지 않았다"
      disposition: gap (다음 감사 대상)

  uses:
    - regression-baseline
    - interview-portfolio
