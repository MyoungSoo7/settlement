# Seed: board-service 메타 주도 게시판 as-is 사양
# 상태: CONFIRMED (2026-08-22 역산, Phase 1~3 완료 시점)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.

seed:
  id: board-service-meta-driven-board-v1
  revision: v1
  revision_baseline: "develop 92d25c463 (2026-08-22)"
  goal: >-
    board-service 의 메타 주도 게시판 루프(정의 1행 = 게시판 1개 · 정의가 게시글 규칙을 소유 ·
    역할 allowlist 인가 · 매직바이트 첨부 검증)의 현행 동작을 실행 가능한 게이트에 매핑된 불변
    사양으로 결정화해, 회귀 기준선 · "게시판 추가에 배포가 필요 없다"는 설계 전제의 방어선 ·
    면접/포트폴리오 문서로 사용한다.

  scope:
    included:
      - BoardDefinition 라이프사이클 · 스킨↔정책 정합
      - 인가 모델 (역할 allowlist 4행위)
      - 게시글·댓글 상태·가시성·IDOR 대조
      - 본문 정화(XSS) 경계
      - 첨부 매직바이트 판정 · 다운로드 헤더
    excluded:
      - 프론트 렌더 컴포넌트 내부
      - RBAC permissions 테이블 (order-service 소유 — 읽지 않는다)
      - 메뉴 등록 (order POST /admin/menus 가 한다)
      - 분류 코드의 의미 (공통코드 그룹 — 표시용 라벨)
      - 파일 저장소 백업·보존 정책

  constraints:
    - "MSA 경계: order DB(permissions·menus·users) 를 읽거나 쓰지 않는다 — 역할은 JWT 클레임으로 온다"
    - "헥사고날: domain 은 adapter 를 import 하지 않는다 (ArchUnit 강제)"
    - "발행 0 · 소비 0 — Outbox·Kafka 컨슈머를 추가하지 않는다(lemuel_board 에 그 테이블이 없다)"
    - "인가는 애그리거트 안에 둔다 — 컨트롤러 판정은 어댑터가 늘 때 조용히 빠지고 그게 IDOR 이다"
    - "도메인 public setter / @Setter·@Data 금지 (OO 게이트)"

  invariants:  # as-is 코드 사실 — 파일:라인 근거
    definition_owns_post_rules:
      source: board-service/src/main/java/github/lms/lemuel/board/domain/BoardPost.java:42  # create
      rule: >-
        BoardPost.create 가 BoardDefinition 을 인자로 받아 조립 시점에 닫힘·쓰기 권한·작성자 위조·
        비밀글 허용·분류 그룹을 한 번에 검사한다. 응용·웹 계층이 같은 규칙을 다시 검사하지 않는다.
      rehydrate: board-service/src/main/java/github/lms/lemuel/board/domain/BoardPost.java:76
      rehydrate_rule: "재검증하지 않는다 — 정책이 강화되면 기존 게시판 조회 자체가 죽는다"
    skin_policy_coherence:
      skins: [LIST, GALLERY, FAQ, QNA]
      enforcement:
        - {skin: GALLERY, requires: attachments, source: BoardDefinition.java:188}
        - {skin: QNA, requires: comments, source: BoardDefinition.java:192}
      rule: "create(:39) 와 update(:90) 가 같은 검사를 지난다 — 수정에만 검사가 없으면 사후 우회 경로가 된다"
      sealed_reason: "스킨을 늘리는 일은 데이터 입력이 아니라 프론트 컴포넌트를 만드는 일이다(렌더 불가 게시판 방지)"
    authorization:
      source: board-service/src/main/java/github/lms/lemuel/board/domain/BoardDefinition.java:205-218
      actions: [canRead, canWrite, canComment, canManage]
      comment_precondition: "canComment 는 역할 이전에 댓글 활성 여부를 먼저 본다(:214)"
      empty_set_semantics:
        read: "비면 공개 — 비로그인 방문자도 읽는다(공지사항)"
        write_comment_manage: "비울 수 없다 — 익명 쓰기는 스팸 벡터"
      enforced_by: board-service/src/main/java/github/lms/lemuel/board/domain/BoardAccessPolicy.java:45
      no_permission_codes: "RBAC permissions 코드로 판정하지 않는다 — 그 테이블은 order(opslab) 소유다"
      idor: "주체는 JWT 에서만 만든다(BoardActor·BoardAuthor). 요청 파라미터의 작성자 식별자는 신뢰하지 않는다"
      location: "인가는 애그리거트 안 — post.edit(actor, definition, ...) (BoardPost.java:97)"
    post_lifecycle:
      states: [PUBLISHED, HIDDEN, DELETED]
      terminal: [DELETED]
      guard: board-service/src/main/java/github/lms/lemuel/board/domain/BoardPost.java:181,222  # assertNotDeleted
      operations:
        softDelete: {source: BoardPost.java:113, who: 작성자(수정 권한), meaning: 작성자의 의사표시}
        hide: {source: BoardPost.java:128, who: 운영 역할만, meaning: 되돌릴 수 있는 조치}
        restore: {source: BoardPost.java:135, who: 운영 역할만}
        changePinned: {source: BoardPost.java:121, who: 운영 역할만, note: 작성자라도 자기 글을 고정할 수 없다}
      rule: "숨김과 삭제를 합치지 않는다 — 합치면 운영자가 내린 글을 작성자가 되살릴 수 있게 된다. 숨긴 글은 작성자에게도 보이지 않는다"
      comment_states: [PUBLISHED, DELETED]
      comment_delete: "visibleContent() 가 자리표시만 돌려주고 원문은 감사용으로 DB 에만 남는다 — 응답 경로로 내보내지 않는다"
      reply_depth: "답글은 1단까지(resolveParentId). 다른 글의 댓글·삭제된 댓글에는 달 수 없다"
    content_format:
      rule: "본문 형식은 작성 시점 스냅샷 — 정책이 TEXT→HTML 로 바뀌어도 이미 쓴 글의 렌더 방식은 그대로다"
      reason: "평문으로 쓴 글이 갑자기 마크업으로 해석되면 깨져 보이거나, 더 나쁘게는 실행된다"
      formats: [TEXT, MARKDOWN, HTML]
    sanitization:
      where: "저장 시점 한 곳(BoardContentSanitizer) — 작성·수정 두 경로가 모두 지난다"
      split: "판단은 도메인(BoardContentPolicy.requiresSanitize), 수행은 어댑터(SanitizeHtmlPort)"
      strategy: "화이트리스트(jsoup Safelist)만 — 블랙리스트는 <svg/onload=> 조합형 우회를 못 따라잡는다"
      scope: "HTML 만 정화. MARKDOWN 원문을 HTML 정화기에 넣으면 코드 블록의 정당한 예시 태그까지 사라진다"
      timing: "렌더 시점으로 미루지 않는다 — 원문을 쌓아 두면 나중에 HTML 렌더를 켜는 한 줄이 그동안 쌓인 모든 행을 동시에 발화시킨다"
    attachments:
      trust_model: "요청이 주장하는 값 중 믿는 것이 하나도 없다"
      type_detection: "매직바이트로 판정(DetectFileTypePort). 요청 Content-Type 은 버리고 판정값을 저장해 다운로드 응답에 쓴다"
      mismatch: board-service/src/main/java/github/lms/lemuel/board/domain/AttachmentUpload.java:91  # 판정≠선언 → 거절(shell.jpg)
      always_blocked: {source: AttachmentUpload.java:27, values: [svg, svgz, html, htm, xhtml, xml, xht], checked_at: AttachmentUpload.java:87}
      unknown_format: "인식 못 한 형식은 통과시키지 않는다 — 서버가 모르는 바이트를 브라우저는 추측해서 실행할 수 있다"
      signature_less: "시그니처 없는 형식(txt·csv·md·json)은 내용 스니핑(NUL 없음·UTF-8 디코딩·제어문자 1% 이하). 순서는 시그니처 → 텍스트"
      stored_name: "서버가 만든 UUID — 업로더 이름은 표시용, 경로에 넣지 않는다"
      download_headers: [판정된 Content-Type, "이미지만 inline(나머지 attachment)", "X-Content-Type-Options: nosniff"]
      order: board-service/src/main/java/github/lms/lemuel/board/domain/BoardPost.java:150  # 판정 → assertCanAttach → 저장 → 행 기록
      order_reason: "저장 뒤에 거절하면 거절당한 파일이 디스크에 남는다"
      list_thumbnail: "목록 대표 이미지는 한 번의 질의로 채운다(findFirstImageByPostIds) — 글마다 부르면 한 화면에 20왕복"
    board_key:
      immutable: true
      reason: "URL 이자 메뉴 행이 가리키는 값 — 바꾸면 이미 나간 링크가 전부 죽는다. update 커맨드에 키가 없는 것은 실수가 아니다"
      pattern: board-service/src/main/java/github/lms/lemuel/board/domain/BoardDefinition.java:31  # 2~40자 소문자·숫자·하이픈
      normalization: board-service/src/main/java/github/lms/lemuel/board/domain/BoardDefinition.java:132  # 소문자로 접어 중복 검사
    board_lifecycle:
      deactivate: BoardDefinition.java:111
      activate: BoardDefinition.java:119
      idempotent_reapply: "현재 상태와 같으면 예외 — 무의미한 재적용을 성공으로 보고하지 않는다"
      delete_guard: "닫힌 게시판만 삭제 가능 — 운영 중 게시판을 한 호출로 지우면 링크와 메뉴 행이 동시에 죽는다"
    query_visibility:
      rule: "가시성은 질의 조건으로 번역한다(PostSearchCriteria) — 페이지를 읽고 자바에서 걸러 내면 총건수와 페이지 크기가 어긋난다"
      dynamic_conditions: "Specification 으로. ':param IS NULL OR col = :param' JPQL 은 PostgreSQL 에서 bytea 비교 오류 전력"
      page_size_cap: 100   # PostListQuery

  event_contracts:
    topics: []        # 발행 0
    consumers: []     # 소비 0
    rule: >-
      Kafka 토픽 없음. Outbox·컨슈머를 추가하지 않는다 — 스캔이 github.lms.lemuel.board 로 한정돼
      shared-common 의 Outbox·Audit 엔티티를 의도적으로 들이지 않는다(lemuel_board 에 그 테이블이 없다).
    menu_boundary: >-
      메뉴 행을 만들지 않는다. menus 는 order-service 소유이고, 게시판 생성 후 메뉴 등록은 관리 화면이
      기존 POST /admin/menus 를 한 번 더 호출한다. 게시판 생성이 곧 전사 네비게이션 변경이 되면
      테스트로 만든 게시판·오타 난 이름이 즉시 모두에게 노출된다.

  response_contract:
    rules:
      - {situation: "키 중복", status: 409}
      - {situation: "불변식 위반(스킨↔정책·형식·삭제 가드)", status: 400}
      - {situation: "없는 게시판", status: 404}
      - {situation: "읽을 수 없는 게시판·게시글", status: 404, reason: "403 은 존재를 알려 줘 키 대입 탐색을 허용한다"}
      - {situation: "쓰기·수정·삭제 권한 없음", status: 403, reason: "대상의 존재를 이미 아는 주체의 조작이라 감출 것이 없다"}
    catch_all_forbidden: "@ExceptionHandler(Exception.class) 를 두지 않는다 — AccessDeniedException 까지 삼켜 403 이 500 이 된다"

  acceptance_criteria:
    - id: AC-1
      criterion: 정의 라이프사이클·스킨↔정책 정합이 create/update 에서 동일하게 강제된다
      gate: "./gradlew :board-service:test — BoardDefinition 도메인 테스트"
    - id: AC-2
      criterion: 인가 4행위 allowlist, 읽기 공백=공개 / 쓰기·댓글·운영 공백 금지
      gate: "BoardAccessPolicy · BoardDefinition 테스트"
    - id: AC-3
      criterion: 게시글 상태 전이(DELETED 종단)·IDOR 대조·숨김 권한이 성립한다
      gate: "BoardPost 도메인 테스트"
    - id: AC-4
      criterion: 본문 정화가 작성·수정 두 경로에서 동작한다
      gate: "정화 테스트 (BoardContentSanitizer)"
    - id: AC-5
      criterion: 첨부 매직바이트 판정·ALWAYS_BLOCKED·다운로드 헤더 3종
      gate: "첨부 도메인·어댑터 테스트"
    - id: AC-6
      criterion: 응답 규약(404/403 분리, catch-all 없음)
      gate: "컨트롤러·예외 테스트"
    - id: AC-7
      criterion: 커버리지 LINE >= 90%
      gate: "./gradlew :board-service:jacocoTestCoverageVerification"
    - id: AC-8
      criterion: 발행 0·소비 0 경계가 유지된다
      gate: "topic-consumer-gate(board 소유 토픽 0) · outbox-poller-gate 대상 밖"
    - id: AC-9
      criterion: 헥사고날 의존 방향 위반 0
      gate: "ArchUnit"

  known_issues:
    - id: KI-1
      finding: >-
        management.server.port 가 8115 로 education-service 의 server.port 기본값과 겹쳤다.
        compose 는 컨테이너 내부 8080 을 써서 무사했지만 로컬 동시 기동은 나중에 뜬 쪽이 기동 실패했다.
      resolution: >-
        board 는 그대로 두고 education 을 8116/8117 로 옮겼다(education/application.yml 의
        server.port 기본값 8116 + management.server.port 기본값 8117 신설). board 의 8114/8115 는
        이미 gateway·compose·문서에 퍼져 있어 옮기는 쪽의 파급이 더 작았다.
      disposition: fixed
      refs: [education-service/src/main/resources/application.yml,
             docs/plan/prd/education-service.md G-3]
    - id: KI-2
      finding: >-
        메뉴 행이 시드가 아니라 런타임에 만들어져 menu-route-gate 의 시드 대조 대상이 아니다
        (ROUTES_WITHOUT_MENU 에 사유와 함께 등록됨). 게시판 라우트의 메뉴 존재는 기계로 검증되지 않는다.
      disposition: by-design (라우트가 게시판 수만큼 늘지 않는 설계의 대가)
    - id: KI-3
      finding: "분류가 공통코드 그룹 코드 문자열 참조(BOARD_CAT_*)라 cross-DB FK 가 없다 — order 쪽에서 그룹을 지워도 board 는 모른다"
      disposition: by-design (표시용 라벨)
    - id: KI-4
      finding: "작성자 표시명이 작성 시점 마스킹 스냅샷(ad***)이라 사용자가 이름을 바꿔도 과거 글은 그대로다"
      disposition: by-design (user 프로젝션을 만들지 않는다는 경계의 대가)
    - id: KI-5
      finding: "첨부 파일은 파일시스템에 저장되고 트랜잭션 밖이다. DB 기록 실패 시 손으로 되돌리는데, 그 되돌리기가 실패하면 고아 파일이 남는다"
      disposition: recorded-not-fixed
    - id: KI-6
      finding: "첨부 볼륨(APP_BOARD_ATTACHMENT_BASE_DIR)을 마운트하지 않고 컨테이너를 다시 만들면 첨부 파일만 사라지고 DB 행은 남아 다운로드가 404 로 떨어진다"
      disposition: recorded-not-fixed

  uses:
    - regression-baseline
    - brownfield-base
