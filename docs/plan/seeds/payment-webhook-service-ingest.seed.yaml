# Seed: payment-webhook-service 결제 웹훅 수신 as-is 사양 (Ouroboros 방법론 — Interview → Seed 결정화)
# 상태: CONFIRMED (기존 서비스 seed 와 동일 방식 지시로 승인 승계, 2026-08-13)
# 원칙: 이 Seed 는 "현행 코드가 실제로 하는 일"의 불변 기술이다. 결함은 교정하지 않고 known_issues 로만 기록한다.

seed:
  id: payment-webhook-service-ingest-v1
  goal: >-
    payment-webhook-service(Go 폴리글랏 8111 — 원문 바이트 HMAC 상수시간 검증·eventType:paymentKey
    TTL 멱등·자사 계약으로 정규화해 lemuel.payment.confirmed 발행·브로커 없으면 LogPublisher 폴백)의
    현행 동작을 실행 가능한 게이트에 매핑된 불변 사양으로 결정화해, 회귀 기준선 · 면접/포트폴리오 문서 ·
    후속 하드닝 베이스로 사용한다.

  scope:
    included:
      - 서명 검증 (원문 바이트 HMAC-SHA256 base64·상수시간·fail-closed)
      - 멱등 (eventType:paymentKey·메모리 TTL 24h·지연 축출)
      - 정규화 발행 (자사 스키마·key 파티셔닝·acks=all·Log 폴백)
      - HTTP 표면 (본문 상한·상태코드 계약·healthz·graceful shutdown)
    excluded:
      - 결제 승인/취소 도메인 판단 (order-service 소관)
      - 정산 반영 (settlement-service 소관) · PG 대사

  constraints:
    - "DB 없음 — 무영속 엣지. Outbox 패턴이 성립하지 않는다(트랜잭션 경계 부재)"
    - "shared-common 미의존 — Go 모듈. ADR 0024 양방향 계약 테스트에 참여 불가"
    - "하류는 Toss 계약이 아니라 자사 PaymentConfirmedEvent 계약에 의존한다"
    - "TOSS_WEBHOOK_SECRET 미설정이면 서비스는 뜨되 전 요청 401(fail-closed)"
    - "distroless static nonroot 이미지 — 셸 없음"

  invariants:  # as-is 코드 사실 — 파일:라인 근거 (경로 접두 payment-webhook-service/)
    signature_verification:
      source: internal/webhook/{handler.go:68-82, signature.go:10-43}
      rule: >-
        (0) io.LimitReader(1MiB)로 원문 바이트 확보 → (1) Toss-Signature 헤더와 HMAC-SHA256(secret, rawBody)
        base64 를 대조. JSON 파싱은 서명 통과 후에만 — 파싱/재직렬화하면 바이트가 달라져 서명이 깨진다.
        secret 또는 provided 가 빈 문자열이면 즉시 false. 양쪽 base64 디코드 후 hmac.Equal 상수시간 비교
        (디코드 실패는 '불일치'로 처리). 불일치 401
    idempotency:
      source: internal/{idempotency/store.go:13-64, webhook/handler.go:96-109}
      rule: >-
        dedupeKey = eventType + ":" + paymentKey. MemoryStore.MarkIfNew 는 단일 mutex 안에서 check-and-set
        (동시 중복 배달 레이스 방지, 인터페이스 주석 명문). TTL 24h, 만료 엔트리는 조회 시 지연 재마킹.
        중복이면 200 + {received:true, duplicate:true} 이고 재발행하지 않는다 — PG 에 200 을 주지 않으면
        재전송이 영원히 계속되기 때문
    normalized_event:
      source: internal/publisher/publisher.go:14-36 + internal/webhook/handler.go:111-119
      rule: >-
        Topic = lemuel.payment.confirmed (레포 컨벤션 lemuel.<domain>.<event>).
        PaymentConfirmedEvent{eventType, paymentKey, orderId, status, totalAmount(int64), occurredAt(RFC3339 UTC)} —
        Toss 원형과 의도적으로 분리(주석 명문). Key() = paymentKey
    kafka_publish:
      source: internal/publisher/kafka.go:20-52
      rule: "kafka-go Writer — Balancer kafka.Hash{}(key 해시 → 결제별 파티션 고정 = 순서 보존), RequiredAcks=RequireAll, AllowAutoTopicCreation=true. 발행 실패는 error 반환 → 핸들러가 500"
      fallback: "KAFKA_BROKERS 미설정/공백이면 LogPublisher 선택 — 브로커 없이 전 경로(서명·멱등·정규화) end-to-end 실행 가능 (main.go:40-48)"
    http_surface:
      source: internal/httpserver/server.go:13-25 + internal/webhook/handler.go:61-128
      rule: >-
        Go 1.22 ServeMux — GET /healthz{status:UP}, POST /webhooks/toss.
        상태코드 계약: 본문 read 실패 400 · 서명 불일치 401 · JSON 파싱 실패 400 · paymentKey 결측 400 ·
        멱등 스토어 오류 500 · 중복 200(duplicate=true) · 발행 실패 500 · 정상 200(duplicate=false)
    runtime:
      source: cmd/server/main.go:22-103 + Dockerfile
      rule: >-
        PAYMENT_WEBHOOK_PORT(8111)·TOSS_WEBHOOK_SECRET(빈 값이면 warn)·KAFKA_BROKERS(콤마 구분).
        ReadHeaderTimeout 5s, SIGINT/SIGTERM 시 10초 graceful shutdown(실패하면 exit 1).
        golang:1.22-alpine 빌드 → distroless/static-debian12:nonroot, CGO_ENABLED=0 -trimpath -s -w

  event_contracts:
    published:
      - topic: lemuel.payment.confirmed
        key: paymentKey
        consumers: [notification-service]
        schema_registered: false   # shared-common testFixtures 에 스키마 없음 — ADR 0024 미참여
    consumed: []
    note: >-
      Java Outbox 규약과 필드명이 다르다(paymentId/amount 대신 paymentKey/totalAmount) — notification 템플릿이
      폴백 체인으로 흡수 중. event_id 헤더도 싣지 않아 하류 eventId 결정이 kafka key(=paymentKey)로 떨어진다

  acceptance_criteria:  # 실행 가능 — 각 AC 는 기존 게이트에 매핑
    - id: AC-1
      criterion: HMAC 계산·상수시간 비교·빈 시크릿/헤더 거부가 일치한다
      gate: "go test ./... -race — internal/webhook/signature_test.go"
    - id: AC-2
      criterion: 핸들러 상태코드 계약(400/401/200 duplicate/500)이 일치한다
      gate: "internal/webhook/handler_test.go"
    - id: AC-3
      criterion: 멱등 check-and-set·TTL 만료 재마킹이 일치한다
      gate: "internal/idempotency/store_test.go"
    - id: AC-4
      criterion: Go 빌드·vet·race 테스트 GREEN
      gate: ".github/workflows/polyglot-ci.yml (Go 매트릭스)"

  known_issues:  # 발견만 기록 — 사양은 as-is 유지
    - id: KI-1
      finding: >-
        ★ 발행 실패 이벤트가 영구 유실된다 — 멱등 선점(handler.go:98)이 발행(:120)보다 먼저이고 실패 시
        선점을 되돌리지 않는다. 1차: 선점 성공 → 발행 실패 → 500. PG 재전송: 선점 실패 → duplicate:true 200
        → 발행 없음. PG 는 성공으로 알고 재시도를 멈춘다. '500 을 돌려 PG 재전송에 맡긴다'는 설계 의도가
        멱등 순서 때문에 무력화. 유실 창 = TTL 24시간
      disposition: recorded-not-fixed (high — 이벤트 유실)
    - id: KI-2
      finding: "★ 서명 스킴이 Toss 실제 규격이 아니다 — signature.go:23-26 주석 명문('Toss' production webhook signature spec differs … must be substituted before real use'). 현 구현으로는 진짜 Toss 웹훅을 한 건도 통과시키지 못한다"
      disposition: by-design-documented (MVP) — 실사용 전 교체 필수
    - id: KI-3
      finding: "★ 외부 도달 경로가 없다 — docker-compose.yml 정의 없음, 게이트웨이 라우트 없음. PG 가 호출할 공개 엔드포인트가 존재하지 않아 현재 어떤 웹훅도 받지 않는다(실 결제 웹훅은 order-service 의 /admin/pg/** 계열이 처리)"
      disposition: recorded-not-fixed (high — 미배선)
    - id: KI-4
      finding: "lemuel.payment.confirmed 가 계약 스키마 없이 흐른다 — shared-common testFixtures contracts/events 에 이 토픽 스키마 부재(payment.captured·refunded 는 존재). 프로듀서(Go)·컨슈머(Kotlin) 모두 shared-common 미의존이라 ADR 0024 양방향 계약 테스트 자체가 불가"
      disposition: recorded-not-fixed (medium — 계약 사각지대)
    - id: KI-5
      finding: "페이로드 필드명이 Java 규약과 다르다(paymentKey/totalAmount vs paymentId/amount) — notification 템플릿이 폴백 체인으로 흡수(NotificationTemplate.kt:45,51-52). 불일치 비용이 컨슈머 코드에 전가돼 있다"
      disposition: recorded-not-fixed (low)
    - id: KI-6
      finding: "event_id 헤더 미발행 + payload 에 eventId/id 필드 없음 → 하류 notification 의 eventId 가 kafka key(=paymentKey)로 결정된다. 같은 paymentKey 로 서로 다른 eventType 두 건을 보내면 두 번째가 하류 dedupe 로 스킵된다(정확히 이 위험을 DomainEventListener.kt:77-82 주석이 지적)"
      disposition: recorded-not-fixed (medium — 하류 멱등 약화)
    - id: KI-7
      finding: "AllowAutoTopicCreation=true — 토픽명 오타 시 브로커가 조용히 새 토픽 생성(파티션·복제는 브로커 기본값). '발행은 성공했는데 아무도 못 받는' 형태로 나타난다"
      disposition: recorded-not-fixed (low)
    - id: KI-8
      finding: "멱등이 프로세스 메모리 — 재시작·스케일아웃 시 중복 발행. polyglot-services.md 명문. 다만 이 토픽의 유일한 컨슈머 notification 도 processed_events 가 아닌 자체 인메모리 dedupe 를 써서 같은 휘발성을 갖는다"
      disposition: by-design-documented (무영속 MVP)
    - id: KI-9
      finding: "/metrics·카운터 없음 — 서명 실패율·중복률·발행 실패 건수를 지표로 볼 수 없어 KI-1 이 실제로 발생해도 알림을 걸 방법이 없다(MemoryStore.Len 은 tests/diagnostics 전용)"
      disposition: recorded-not-fixed (medium)

  uses:
    - regression-baseline
    - interview-portfolio
    - brownfield-base
