# Seed: company-service 사업장 월별 시계열 추이 조회 (Ouroboros 방법론 — Interview → Seed)
# 상태: IMPLEMENTED (2026-07-30 인터뷰 결정화 → 당일 TDD 구현 완료 — 백엔드 f435c51ab · 프런트 9d87df432)
#   이제 회귀 기준선으로 쓸 수 있다.
#   게이트: :company-service:test + jacocoTestCoverageVerification(LINE 90%) + HexagonalArchitectureTest +
#     guard.mjs + 프런트 vitest/build.
# 산출: Ouroboros Interview Path B(플러그인 폴백 — MCP 질문 생성기 크레딧 부족으로 2회 실패) → 직접 결정화.
#   인터뷰 전문(Q1~Q7 결정 이력)은 로컬 scratch 아티팩트로 보관하며 Git 에는 추적하지 않는다.
# 스키마: Ouroboros 네이티브(goal/constraints/acceptance_criteria/...) — 자매 시드
#   company-service-workforce-comparison.seed.yaml 과 같은 형태이며, 사내 as-is 스키마
#   (seed.invariants/known_issues)와는 다르다.
# 자매 문서(사람용 요약): company-service-workforce-history.seed.md

goal: company-service 에 사업장 키(사업장명 + 사업자번호 앞6자리) 고정 월별 시계열을 반환하는 내부 인증 GET /api/company/workforce/history 를 신설해, 월 오름차순 원시값(인원·추정연봉·상한 플래그)과 연속 인접 월에만 계산되는 전월 대비 증감(결측 갭·첫 월 null, HALF_UP)을 제공하고 WorkforcePage 상세에 추이 섹션을 추가하되, 보간·명칭변경 재연결·랭킹·집단 추이·이벤트 발행은 제외하며 기존 목록·상세 응답은 불변으로 유지한다.
task_type: code

brownfield_context:
  project_type: brownfield
  context_references:
  - path: company-service/
    role: primary
    summary: 국민연금 사업장 스냅샷 적재·조회가 있는 주 모듈. history 엔드포인트와 시계열 도메인이 붙을 자리
  - path: frontend/src/pages/WorkforcePage.tsx
    role: primary
    summary: 상세 화면 — 추이 섹션(단월 안내 포함)이 추가될 자리
  - path: docs/plan/seeds/company-service-workforce-comparison.seed.yaml
    role: reference
    summary: 직전 시드(IMPLEMENTED). 횡단면 비교를 담당하며 "월별 시계열 추이"를 명시 제외했다 — 이 시드는 그 후속
  existing_patterns:
  - UNIQUE(workplace_name, biz_reg_no_prefix, snapshot_month) 인덱스의 prefix 스캔 조회
  - 금액 wire 를 소수 문자열로 내보내는 DTO 규약(String 필드 + toPlainString())
  - JWT ADMIN/MANAGER 게이트가 걸린 /api/company/workforce/** 표면
  - 오류 바디 {"message"} 계약과 검증 순서 규약
  existing_dependencies:
  - PostgreSQL 17
  - shared-common JWT (제한 스캔 @Import)
  - BigDecimal · RoundingMode.HALF_UP
  - java.time.YearMonth

constraints:
- 시리즈 키는 (사업장명, 사업자번호 앞6자리) 2요소로 고정한다. 앞6자리는 단독 유일이 아니므로 사업장명이 바뀌면 시리즈가 단절되는 것을 수용한다 — 명칭 변경 재연결 휴리스틱은 오탐 위험으로 기각한다.
- 결측 월은 보간하지 않는다. 수집을 건너뛴 달은 시리즈에서 빠진 채 노출하고, 증감은 연속된 인접 월(YearMonth+1)일 때만 계산한다.
- 파생값은 순증감만 가능하다 — 입사·퇴사 gross 분리는 원천 데이터(사업장 합계 스냅샷)로 불가능하다.
- 증감은 서버에서 계산한다. 프런트로 미루면 라운딩 정책(HALF_UP, 비율 2자리·금액 0자리)과 금액 문자열 계약이 프런트로 샌다.
- 신규 엔드포인트로 분리하고 기존 목록·상세 응답은 불변으로 유지한다(직전 시드 AC-1 정신). history 는 월 파라미터가 없는 2요소 키 계약으로 3요소 상세와 구분된다.
- 금액 wire 는 소수 문자열이다 — Boot 4 런타임의 HTTP 변환이 Jackson 3 이라 직렬화기 애너테이션이 무시되는 함정(직전 시드 결함 2) 때문에 DTO 필드 타입 String + toPlainString() 을 쓴다.
- 신규 Flyway 마이그레이션 0 — 기존 UNIQUE 인덱스의 prefix 스캔으로 충족한다.
- Kafka 이벤트 발행 없음.

scope_excluded:  # 인터뷰 Q6 에서 전부 명시 제외
- 증감 랭킹 TOP N
- 업종/지역 집단 추이
- 신규/소멸 사업장 탐지
- Kafka 이벤트 발행
- 명칭 변경 재연결 휴리스틱
- 결측 월 보간

key_decisions:  # 인터뷰에서 확정
- id: D-1
  decision: 시리즈 키 = (사업장명, 사업자번호 앞6자리) — 상세 복합키에서 월을 뺀 2요소
  rationale: 기존 UNIQUE 인덱스 prefix 스캔으로 신규 마이그레이션 0. 명칭 변경 시 단절은 수용(재연결은 오탐 위험)
- id: D-2
  decision: 결측 월은 구멍으로 두고, 증감은 인접 월일 때만 계산
  rationale: 보간은 없는 데이터를 있는 것처럼 보이게 한다. 갭을 사이에 둔 두 스냅샷 간 증감은 null
- id: D-3
  decision: 순증감 4종만 — headcountChange(명)·headcountChangeRate(%)·salaryChange(원)·salaryChangeRate(%)
  rationale: 원천이 사업장 합계 스냅샷이라 입사·퇴사 gross 분리가 불가능
- id: D-4
  decision: 증감은 서버 계산
  rationale: 표시 정밀도 규칙(HALF_UP, 비율 2자리·금액 0자리)을 도메인이 보존해야 한다
- id: D-5
  decision: 신규 엔드포인트로 분리
  rationale: 기존 목록·상세 응답 불변 유지
- id: D-6
  decision: 금액 wire 는 소수 문자열(String + toPlainString())
  rationale: Boot 4 의 Jackson 3 HTTP 변환에서 직렬화기 애너테이션이 무시된다(직전 시드에서 실측된 결함)

data_facts:  # 인터뷰 [from-code] 확인
- 적재 스냅샷이 2026-06 1개월뿐 → AC-4(단월)가 초기 상태의 실경로다
- 저장 행은 적재 규칙상 headcount>0 · 고지금액>0 이지만 추정연봉 계산은 방어적으로 null 을 허용한다(가입자수 0 이력 행 가능) — 증감도 어느 한쪽이 null 이면 null
- snapshot_month 는 엔티티에 "YYYY-MM" 문자열로 저장 — 사전순 정렬이 곧 시간순 정렬

acceptance_criteria:
- id: AC-1
  description: 신규 GET /api/company/workforce/history?name&bizRegNoPrefix (JWT ADMIN/MANAGER) 가 월 오름차순 시리즈(월·인원·추정연봉 문자열·상한 도달 플래그)를 반환하고, 미매칭은 404 · 형식 위반은 400 을 기존 {"message"} 계약으로 낸다(검증 순서 name → bizRegNoPrefix).
  gate: ./gradlew :company-service:test — 컨트롤러/서비스 테스트
- id: AC-2
  description: 증감은 연속 인접 월에서만 계산된다 — headcountChange·headcountChangeRate·salaryChange(문자열)·salaryChangeRate. 결측 갭과 첫 월은 null, 라운딩은 HALF_UP(비율 2자리·금액 0자리), 전월 값이 0 이면 rate 는 null.
  gate: 도메인 단위 테스트
- id: AC-3
  description: 시리즈 키가 (사업장명 + 앞6자리)로 고정된다 — 명칭 변경 단절·보간 없음·재연결 없음이 테스트로 고정된다.
  gate: 도메인/영속 테스트
- id: AC-4
  description: 단월(길이 1) 시리즈가 정상 반환되고(증감 전부 null) 화면은 "추이 데이터 1개월" 안내를 띄운다.
  gate: 백엔드 테스트 + 프런트 vitest
- id: AC-5
  description: 기존 목록·상세 응답이 불변이고 공통 게이트와 프런트 vitest/build 가 GREEN 이다.
  gate: :company-service:jacocoTestCoverageVerification(LINE 90%) · HexagonalArchitectureTest · guard.mjs · 프런트 vitest/build

evaluation_principles:
- 이 Seed 의 성패는 "추이가 그려지는가"가 아니라 "없는 데이터를 있는 것처럼 만들지 않는가"로 판정한다 — 결측 갭에서 증감이 나오면 실패다.
- 라운딩·금액 문자열 계약은 화면 확인이 아니라 응답 바디 어서션으로 판정한다(직전 시드에서 애너테이션 무시 결함이 실측됐다).

exit_conditions:
- ./gradlew :company-service:test :company-service:jacocoTestCoverageVerification 통과(LINE 90%)
- HexagonalArchitectureTest 통과
- node scripts/harness/guard.mjs --staged 통과
- 프런트 vitest + build GREEN

