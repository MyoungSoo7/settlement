goal: company-service의 국민연금 사업장가입자 데이터를 활용해 사업장별 업종·지역 비교 정보를 제공하는 단건 상세 조회 기능과 월별 사전 집계 체계를 구현한다.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: company-service/
    role: primary
    summary: 기존 company_workforce 도메인·조회 API·CSV 적재·Flyway 마이그레이션과 신규 상세 비교 기능을 구현할 주 모듈
  existing_patterns:
  - company_workforce의 UNIQUE(workplace_name, biz_reg_no_prefix, snapshot_month)를 이용한 월별 멱등 업서트
  - GET /api/company/workforce?name= 기반 공개 목록 검색과 페이징
  - POST /admin/company/workforce/import의 Admin키 기반 CSV 적재
  - CompanyWorkforce.estimatedAnnualSalary()의 BigDecimal 추정연봉 계산
  - CompanyWorkforceResponse.note의 추정연봉 한계 안내
  - Flyway 기반 스키마 변경
  - 헥사고날 아키텍처에서 domain의 프레임워크·adapter 의존 금지
  existing_dependencies:
  - PostgreSQL percentile_cont와 cume_dist 윈도 함수
  - Flyway 마이그레이션
  - JPA 엔티티 및 저장소 어댑터
  - 기존 CSV 파서와 bulk upsert SQL
  - ImportCompanyWorkforceUseCase 적재 흐름
  - Java BigDecimal 및 RoundingMode.HALF_UP
constraints:
- 기능은 company-service 내부에서 완결하며 loan-service, investment-service 또는 기타 외부 서비스와 연계하지 않는다
- 기존 GET /api/company/workforce 목록 검색 API의 응답 스키마를 변경하지 않는다
- 상세 조회는 내부 id를 노출하지 않고 workplace_name, biz_reg_no_prefix, snapshot_month 복합키를 query parameter로 받는다
- 비교 대상은 대상 사업장과 동일한 snapshot_month의 유효 레코드로 한정한다
- 비교 지표는 headcount와 estimatedAnnualSalary이다
- 중앙값은 percentile_cont(0.5), 백분위는 cume_dist 의미의 해당 값 이하 사업장 비율로 계산하며 동률에는 동일 백분위를 부여한다
- 중앙값 대비 원값 차이와 증감률을 모두 반환하고 중앙값이 0이면 증감률만 null로 반환한다
- 비교 집단 최소 표본 수는 10건이다
- 업종 폴백은 동일 6자리 industry_code에서 앞 3자리 코드 집단까지 최대 2단계로 수행한다
- 지역 폴백은 address 앞 2토큰의 시도+시군구 집단에서 시도 집단까지 최대 2단계로 수행한다
- 업종과 지역을 교차한 집단 및 평균 기반 비교는 제공하지 않는다
- 사유 코드는 SAMPLE_TOO_SMALL, INDUSTRY_CODE_MISSING, REGION_UNPARSEABLE 정확히 3종만 사용한다
- industry_code가 없어도 상세 조회와 지역 비교는 정상 제공하고 업종 비교만 null로 반환한다
- 폴백 단계는 사유 코드와 분리해 세부 또는 상위 단계로 표시한다
- salaryCapReached는 실패 사유가 아닌 별도 boolean 신뢰도 플래그로 제공하며, 판정식은 estimatedAnnualSalary >= 해당 snapshot_month 상한액 × 12 이다
- 기준소득월액 상한액은 snapshot_month 기준 시기별 고시표로 코드에 내장한다 - 2022-07~2023-06 5530000원, 2023-07~2024-06 5900000원, 2024-07~2025-06 6170000원, 2025-07~2026-06 6370000원, 2026-07~2027-06 6590000원
- company_workforce에 industry_code를 저장하고 기존 적재분을 전량 재적재한다
- 사전 집계는 월별 CSV 업서트 완료 후 해당 월의 집단 중앙값·표본수와 사업장별 백분위를 함께 산출해 원자적으로 통째로 교체한다. 조회 경로는 저장된 값을 읽기만 하며 중앙값·순위·건수를 계산하지 않는다
- 금액 계산은 BigDecimal만 사용하고 모든 나눗셈에 RoundingMode.HALF_UP과 스케일을 명시한다. double/float는 계산·필드·직렬화 어디에도 쓰지 않는다
- 금액 필드는 JSON에서 부동소수점 수치가 아니라 소수 문자열로 직렬화한다. 금액 필드는 estimatedAnnualSalary, salaryCapMonthlyAmount, 그리고 지표가 ESTIMATED_ANNUAL_SALARY 인 경우의 median·difference 뿐이다
- 지표가 HEADCOUNT 인 경우의 median·difference 는 금액이 아니라 인원수 파생값이다. percentile_cont(0.5)는 짝수 표본에서 소수를 산출하므로 정수로 강제하지 않고 소수 한 자리까지 허용한다. 비율(differenceRate, percentile)과 원본 건수(headcount, sampleSize, sourceRowCount)도 금액 규칙 대상이 아니다
acceptance_criteria:
- description: 기존 목록 검색 응답은 유지되며 별도 단건 상세 엔드포인트가 URL 인코딩된 workplace_name, biz_reg_no_prefix, snapshot_month 복합키로 사업장과 비교 정보를 조회하고, 복합키가 어느 레코드와도 매칭되지 않으면 404를, 필수 파라미터 누락·snapshot_month 형식 위반·biz_reg_no_prefix 형식 위반이면 400을 명시된 오류 본문과 함께 반환한다
  semantic_ac_key: ac_6e96441d91faba29
- description: 업종 비교가 완결된다 — 상세 응답은 동일 월의 headcount와 estimatedAnnualSalary 각각에 대해 중앙값, 원값 차이, 증감률, cume_dist 백분위, 표본수, 적용된 비교 단계를 제공하고, 동일 6자리 industry_code 표본이 10건 미만이면 앞 3자리 집단으로 한 단계 넓히며, 폴백 표본도 10건 미만이면 SAMPLE_TOO_SMALL, 업종코드가 없으면 INDUSTRY_CODE_MISSING을 사유로 업종 비교만 null로 반환한다
  semantic_ac_key: ac_1f95c7dbde097609
- description: 지역 비교가 업종 비교와 독립적으로 완결된다 — 상세 응답은 시도+시군구 집단에 대해 두 지표 각각의 중앙값, 원값 차이, 증감률, cume_dist 백분위, 표본수, 적용된 비교 단계를 제공하고, 표본이 10건 미만이면 시도 집단으로 한 단계 넓히며, 폴백 표본도 미달이면 SAMPLE_TOO_SMALL, 주소에서 시도·시군구를 뽑지 못하면 REGION_UNPARSEABLE을 사유로 지역 비교만 null로 반환한다
  semantic_ac_key: ac_3ca0a80efce288b6
- description: estimatedAnnualSalary가 해당 snapshot_month 상한액의 12배 이상이면 상세 응답의 salaryCapReached가 true이고, 이 플래그는 업종·지역 비교의 성공 여부 및 사유 코드와 무관하게 항상 제공된다
  semantic_ac_key: ac_32149f8714a2e1ca
- description: CSV 재적재 후 해당 월의 집단 중앙값·표본수와 사업장별 백분위가 하나의 원자적 교체로 함께 갱신되고, 각 집계 행의 sampleSize가 동일 snapshot_month·동일 축·동일 그룹키에 속하는 적격 레코드 수와 정확히 일치하며, 적재는 수용 행 수와 거부 행 수를 별도로 대사해 원본 CSV 행 수와 합치한다
  semantic_ac_key: ac_083bdca8848fe67a
ontology_schema:
  name: CompanyWorkforceComparison
  description: 국민연금 월별 사업장 데이터를 기반으로 사업장의 인력 규모와 추정연봉을 동종 업종 및 지역 집단과 비교하는 상세 조회·사전 집계 모델
  fields:
  - name: workplaceName
    type: string
    description: 사업장명이며 상세 조회 복합키의 일부
    required: true
  - name: bizRegNoPrefix
    type: string
    description: 사업자등록번호 앞 6자리이며 상세 조회 복합키의 일부
    required: true
  - name: snapshotMonth
    type: string
    description: YYYY-MM 형식의 기준월이며 상세 조회 복합키와 비교 월의 일부
    required: true
  - name: industryCode
    type: string
    description: 원본 CSV의 6자리 사업장 업종코드이며 공란일 수 있음
    required: true
  - name: industryName
    type: string
    description: 원본 CSV의 업종명
    required: true
  - name: address
    type: string
    description: 원본 도로명주소
    required: true
  - name: sido
    type: string
    description: address 첫 토큰에서 파생한 시도
    required: true
  - name: sigungu
    type: string
    description: address 두 번째 토큰에서 파생한 시군구
    required: true
  - name: headcount
    type: integer
    description: 사업장 가입자 수이며 금액이 아닌 건수
    required: true
  - name: estimatedAnnualSalary
    type: decimal
    description: 당월고지금액을 이용해 역산한 1인당 추정연봉. BigDecimal로 계산하고 JSON에는 소수 문자열로 직렬화한다
    required: true
  - name: industryComparison
    type: object
    description: 세부 6자리 industry_code 또는 앞 3자리 상위 업종 집단과의 비교 결과이며 GroupComparison 구조를 따른다
    required: true
  - name: regionComparison
    type: object
    description: 시도+시군구 또는 시도 집단과의 비교 결과이며 GroupComparison 구조를 따른다
    required: true
  - name: GroupComparison.comparisonLevel
    type: string
    description: 실제로 적용된 집단 단계이며 EXACT 또는 BROADENED 이다. 폴백은 집단 단위로 결정되므로 지표별로 달라지지 않고 비교축마다 하나만 존재한다
    required: true
  - name: GroupComparison.groupKey
    type: string
    description: 비교에 사용된 집단 식별자이며 업종축은 6자리 또는 3자리 코드, 지역축은 시도+시군구 또는 시도 문자열이다
    required: true
  - name: GroupComparison.sampleSize
    type: integer
    description: 적용된 비교 집단의 표본 수이며 금액이 아닌 건수. 두 지표가 동일한 집단을 공유하므로 비교축마다 하나만 존재한다
    required: true
  - name: GroupComparison.unavailableReason
    type: string
    description: 비교 불가 사유이며 SAMPLE_TOO_SMALL, INDUSTRY_CODE_MISSING, REGION_UNPARSEABLE 중 하나 또는 비교 성공 시 null 이다. 비교축마다 하나만 존재한다
    required: true
  - name: GroupComparison.headcount
    type: object
    description: 가입자 수 지표의 비교 결과이며 HeadcountMetricComparison 구조를 따른다. 비교 불가 시 null 이다
    required: true
  - name: GroupComparison.estimatedAnnualSalary
    type: object
    description: 추정연봉 지표의 비교 결과이며 MoneyMetricComparison 구조를 따른다. 비교 불가 시 null 이다
    required: true
  - name: MoneyMetricComparison.median
    type: decimal
    description: ESTIMATED_ANNUAL_SALARY 지표의 percentile_cont(0.5) 값이며 사전 집계 테이블에서 읽어온다. BigDecimal로 다루고 JSON에는 소수 문자열로 직렬화한다
    required: true
  - name: MoneyMetricComparison.difference
    type: decimal
    description: 대상 사업장 추정연봉에서 중앙값을 뺀 차이이며 median과 동일한 금액 타입 규칙을 따른다
    required: true
  - name: HeadcountMetricComparison.median
    type: number
    description: HEADCOUNT 지표의 percentile_cont(0.5) 값이며 금액이 아니다. 짝수 표본에서 소수가 나올 수 있으므로 정수로 강제하지 않고 소수 한 자리까지 허용한다
    required: true
  - name: HeadcountMetricComparison.difference
    type: number
    description: 대상 사업장 가입자 수에서 중앙값을 뺀 차이이며 median과 동일하게 소수 한 자리까지 허용한다
    required: true
  - name: differenceRate
    type: number
    description: MoneyMetricComparison 과 HeadcountMetricComparison 양쪽에 공통으로 존재하는 중앙값 대비 증감률(백분율)이며 금액이 아니다. 중앙값이 0이면 null
    required: true
  - name: percentile
    type: number
    description: MoneyMetricComparison 과 HeadcountMetricComparison 양쪽에 공통으로 존재하는 cume_dist 의미의 0~100 백분위이며 금액이 아니다. 비교 대상은 언제나 같은 월 데이터에 존재하는 사업장이므로, 적재·집계 시점에 사업장별로 미리 계산해 WorkforcePercentile 에 저장하고 조회 시에는 그 값을 그대로 읽는다. 조회 경로에서 순위·건수를 세지 않는다
    required: true
  - name: salaryCapReached
    type: boolean
    description: estimatedAnnualSalary 가 기준월 상한액의 12배 이상인지 여부이며 비교 성패와 무관하게 항상 제공된다
    required: true
  - name: salaryCapMonthlyAmount
    type: decimal
    description: snapshot_month 로 고시표에서 해석한 기준소득월액 상한액. BigDecimal로 다루고 JSON에는 소수 문자열로 직렬화한다
    required: true
  - name: WorkforceAggregate
    type: object
    description: 월별 사전 집계 1행이며 조회 경로가 읽는 유일한 집계 원천이다
    required: true
  - name: WorkforceAggregate.snapshotMonth
    type: string
    description: 집계 대상 기준월이며 원자적 교체의 단위
    required: true
  - name: WorkforceAggregate.axis
    type: string
    description: 집계 축이며 INDUSTRY 또는 REGION 이다
    required: true
  - name: WorkforceAggregate.level
    type: string
    description: 집단 단계이며 EXACT 또는 BROADENED 이다. 두 단계 모두 사전 집계되어야 폴백이 조회 시 추가 집계 없이 성립한다
    required: true
  - name: WorkforceAggregate.groupKey
    type: string
    description: 축·단계에 대응하는 집단 식별자
    required: true
  - name: WorkforceAggregate.metric
    type: string
    description: 집계 지표이며 HEADCOUNT 또는 ESTIMATED_ANNUAL_SALARY 이다
    required: true
  - name: WorkforceAggregate.median
    type: decimal
    description: 해당 집단·지표의 중앙값이며 metric 값에 따라 금액 또는 인원수를 담는다. 두 경우 모두 NUMERIC 컬럼에 저장하고 부동소수점 컬럼을 쓰지 않는다. 금액 지표일 때만 JSON 소수 문자열 직렬화 규칙이 적용된다
    required: true
  - name: WorkforceAggregate.sampleSize
    type: integer
    description: 해당 집단의 적격 레코드 수이며 금액이 아닌 건수. 동일 축·동일 그룹키의 원본 적격 행 수와 일치해야 한다
    required: true
  - name: WorkforcePercentile
    type: object
    description: 사업장 1건이 특정 축·단계·지표에서 갖는 집단 내 백분위를 적재 시점에 미리 계산해 보관하는 행. 백분위는 집단 전체가 아니라 개별 사업장 값에 종속되므로 WorkforceAggregate 와 별도로 사업장 단위로 저장한다
    required: true
  - name: WorkforcePercentile.snapshotMonth
    type: string
    description: 기준월이며 WorkforceAggregate 와 동일한 원자적 교체 단위에 속한다
    required: true
  - name: WorkforcePercentile.workplaceKey
    type: string
    description: workplace_name, biz_reg_no_prefix, snapshot_month 복합키로 식별되는 대상 사업장
    required: true
  - name: WorkforcePercentile.axis
    type: string
    description: INDUSTRY 또는 REGION
    required: true
  - name: WorkforcePercentile.level
    type: string
    description: EXACT 또는 BROADENED. 폴백이 어느 단계로 떨어지든 조회 시 재계산이 없도록 두 단계 모두 사전 계산한다
    required: true
  - name: WorkforcePercentile.metric
    type: string
    description: HEADCOUNT 또는 ESTIMATED_ANNUAL_SALARY
    required: true
  - name: WorkforcePercentile.percentile
    type: number
    description: 해당 집단 안에서 이 사업장 값 이하인 레코드 비율을 0~100 으로 표현한 값이며 동률 사업장은 동일 값을 갖는다
    required: true
  - name: AggregateBuild
    type: object
    description: 월 단위 집계 생성 상태이며 원자적 교체의 관측 지점
    required: true
  - name: AggregateBuild.snapshotMonth
    type: string
    description: 생성 대상 기준월
    required: true
  - name: AggregateBuild.status
    type: string
    description: 생성 상태이며 BUILDING 또는 COMPLETE 이다. 조회 경로는 COMPLETE 상태의 집계만 읽는다
    required: true
  - name: AggregateBuild.sourceRowCount
    type: integer
    description: 해당 월 CSV 원본 행 수이며 금액이 아닌 건수. 집계 대사의 기준값이며 sourceRowCount = acceptedRowCount + rejectedRowCount 를 만족해야 한다
    required: true
  - name: AggregateBuild.acceptedRowCount
    type: integer
    description: 적재에 수용되어 집계 모집단이 되는 행 수. WorkforceAggregate.sampleSize 의 축별 합은 이 값에서 파생된다
    required: true
  - name: AggregateBuild.rejectedRowCount
    type: integer
    description: 적재에서 거부된 행 수이며 집계 모집단에 포함되지 않는다. 마지막 수용 기준의 수용·거부 대사가 이 값을 참조한다
    required: true
evaluation_principles:
- name: 비교정확성
  description: 동일 기준월과 확정된 중앙값·cume_dist·폴백 규칙으로 결과가 계산되는지 평가
  weight: 0.3
- name: API호환성
  description: 기존 목록 계약을 보존하고 복합키 상세 조회가 특수문자 사업장명도 안전하게 처리하는지 평가
  weight: 0.2
- name: 데이터정합성
  description: industry_code 재적재와 월별 집계 교체가 원자적이며 표본수가 원본과 일치하는지 평가
  weight: 0.2
- name: 설명가능성
  description: 표본수·비교단계·차이·증감률·백분위·사유 코드가 사용자가 해석할 수 있게 제공되는지 평가
  weight: 0.15
- name: 신뢰도표시
  description: snapshot_month별 상한 도달 여부가 정확히 분리 표시되는지 평가
  weight: 0.1
- name: 성능안전성
  description: 상세 조회가 사전 집계를 사용하고 조회 시 전체 집계를 수행하지 않는지 평가
  weight: 0.05
exit_conditions:
- name: 기능완료
  description: 복합키 상세 조회에서 업종·지역 비교와 상한 신뢰도 플래그가 확정 계약대로 제공됨
  criteria: 모든 비교 시나리오 검증 완료
- name: 데이터완료
  description: industry_code 전량 재적재와 월별 사전 집계가 완료됨
  criteria: 그룹별 sampleSize 가 동일 월·축·그룹키 적격 레코드 수와 일치하고 sourceRowCount = acceptedRowCount + rejectedRowCount 대사 완료
- name: 호환성완료
  description: 기존 목록 검색 API가 변경되지 않음
  criteria: 기존 API 계약 검증 완료
- name: 예외완료
  description: 표본 미달·업종코드 누락·지역 파싱 실패가 정확한 null 및 사유 코드로 처리됨
  criteria: 세 사유 코드와 독립 비교 경로 검증 완료

# 구현 착수 시 TDD 로 흡수할 잔여 항목 (QA 가 지적했으나 Seed 에 반영하지 않기로 명시 결정한 것들).
# 이것들은 결함이 아니라 "아직 정하지 않은 것"이다 — 구현 전에 결정해야 한다.
deferred_to_implementation:
- required 와 nullable 의 구분 표기 (industryCode·sido·sigungu·비교객체는 null 가능한데 모두 required 로 선언되어 있음)
- ErrorResponse 스키마·오류 코드·검증 우선순위, 경계 입력(빈 값·길이 상한·중복 파라미터·잘못된 URL 인코딩) 동작
- 적격·유효 레코드의 판정 기준 (null·0·음수·중복·거부 행을 집계 모집단에 포함하는지)
- 나눗셈 스케일 값 (differenceRate·percentile 의 소수 자릿수)
- 상한 고시표 범위(2022-07~2027-06) 밖 snapshot_month 의 동작 (거부인지, 상한 필드 null 인지)
- 빌드 세대 식별자·중단 복구·stale BUILDING 정리·직전 COMPLETE 보존 규칙
- 세종특별자치시처럼 시군구 계층이 없는 1토큰 주소의 파싱 예외

