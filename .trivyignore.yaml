# SCA 베이스라인 — Trivy SBOM 스캔(ci.yml backend-ci)이 참조한다.
#
# 왜 있나: SCA 게이트를 차단으로 켠 시점(2026-08-12)에 이미 존재하던 부채 48건(HIGH 43 · CRITICAL 5)이다.
#   그전까지 SCA 는 Snyk 스텝이 담당했으나, 토큰이 무효(SNYK-0005 Authentication error)라 실제로는
#   한 번도 스캔하지 않았고 continue-on-error 가 그 실패를 삼켰다 — 즉 이 48건은 "새로 생긴 것"이 아니라
#   "지금까지 아무도 보지 못한 것"이다. 실측 근거: run 31432558450 백엔드 잡 로그.
#
# 설계: semgrep.yml 과 같은 기준 — "새로 생긴 것만 막는다".
#   기존 부채로 파이프라인이 통째로 빨개지지 않게 하되, 신규 HIGH/CRITICAL 은 확실히 차단한다.
#
# ⚠ expired_at 이 지나면 해당 항목은 다시 차단 대상이 된다(부채가 영구히 숨지 않게 하는 장치).
#   기한 안에 처리하지 못하면 날짜를 미루는 게 아니라, 왜 못 고치는지를 여기 statement 에 적을 것.
#
# 해소 경로(대부분 한 번에 사라진다):
#   - spring-boot 4.0.4 → 4.0.6 : spring-*, spring-security, spring-kafka, spring-data,
#     tomcat-embed, netty, jackson, micrometer 는 전부 Boot BOM 관리 버전이라 함께 올라간다.
#   - org.postgresql:postgresql 42.7.3 → 42.7.11, org.bouncycastle:bcprov-jdk18on 1.81 → 1.84 는 개별 상향.
#   갱신 후 재실측: ./gradlew cyclonedxBom && trivy sbom build/reports/cyclonedx/bom.json \
#                    --severity HIGH,CRITICAL --ignore-unfixed
