name: polyglot-ci

# 폴리글랏 서비스(Go 2·Python 3·Kotlin 2 = 배포 단위 7종) 전용 CI — 기존 Java `ci` 워크플로와 독립.
# 여기에 **검증 전용** 1종(receipt-ocr-service)이 더 붙는다: Dockerfile 이 없어 배포 단위가 아니고
# 이미지 푸시 매트릭스에도 들어가지 않지만, 테스트·커버리지 게이트는 같이 돈다.
# MSA 원칙(ci.yml 의 changes 잡과 동일 패턴): dorny/paths-filter 로 변경된 서비스만 골라
# 언어별 테스트 매트릭스와 이미지 푸시 매트릭스를 동적으로 계산한다.
# 이 워크플로 파일 자체가 바뀌면 전 서비스 재검증한다(안전 폴백).
# 필수 체크는 아니고(정보성), Java harness-guard/STATUS 카운트에는 영향이 없다.

on:
  push:
    branches: [main, develop]
    paths:
      - "market-stream-service/**"
      - "payment-webhook-service/**"
      - "screening-backtest-service/**"
      - "settlement-anomaly-service/**"
      - "forecast-service/**"
      - "receipt-ocr-service/**"
      - "notification-service/**"
      - "reconciliation-service/**"
      - ".github/workflows/polyglot-ci.yml"
  pull_request:
    paths:
      - "market-stream-service/**"
      - "payment-webhook-service/**"
      - "screening-backtest-service/**"
      - "settlement-anomaly-service/**"
      - "forecast-service/**"
      - "receipt-ocr-service/**"
      - "notification-service/**"
      - "reconciliation-service/**"
      - ".github/workflows/polyglot-ci.yml"

permissions:
  contents: read

# ci.yml 과 같은 규칙 — PR 은 최신 커밋만 검증(취소), push 는 이미지 푸시 때문에 직렬화만.
concurrency:
  group: polyglot-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }} # MyoungSoo7/settlement (metadata-action 가 소문자화)

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # ci.yml 의 changes 잡과 같은 이유 — dorny/paths-filter 가 pull_request 에서 GitHub API 를
    # 쓰므로 워크플로 수준 `permissions: contents: read` 만으로는 부족하다. 잡 수준에서 보강한다.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_matrix: ${{ steps.setmatrix.outputs.go_matrix }}
      go_any: ${{ steps.setmatrix.outputs.go_any }}
      py_matrix: ${{ steps.setmatrix.outputs.py_matrix }}
      py_any: ${{ steps.setmatrix.outputs.py_any }}
      kt_matrix: ${{ steps.setmatrix.outputs.kt_matrix }}
      kt_any: ${{ steps.setmatrix.outputs.kt_any }}
      push_matrix: ${{ steps.setmatrix.outputs.push_matrix }}
      push_any: ${{ steps.setmatrix.outputs.push_any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ci.yml 의 같은 스텝과 동일한 이유·동일한 구현이다(2026-08-16).
      #   base 를 주지 않으면 dorny 는 기본 브랜치(main)와의 merge-base 를 기준으로 삼는데,
      #   main 이 develop 보다 1300 커밋 뒤처져 있어 develop push 는 무엇을 바꿨든 "전부 바뀜"이 된다
      #   → 폴리글랏 7종 중 하나만 고쳐도 7개가 전부 돈다.
      #   push 는 직전 커밋 대비로, PR 은 그대로 base(main) 대비로 둔다 — 머지 전 전량 검증은 유지된다.
      - name: Resolve paths-filter base
        id: filter_base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${BEFORE:-}" ] \
              && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
              echo "변경 감지 기준: 직전 커밋 ${BEFORE}"
            else
              echo "직전 커밋을 찾을 수 없다(before=${BEFORE:-<empty>}) → 기본 비교(전량 검증)로 떨어뜨린다"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.filter_base.outputs.base }}
          filters: |
            workflow: ['.github/workflows/polyglot-ci.yml']
            market-stream-service: ['market-stream-service/**']
            payment-webhook-service: ['payment-webhook-service/**']
            screening-backtest-service: ['screening-backtest-service/**']
            settlement-anomaly-service: ['settlement-anomaly-service/**']
            forecast-service: ['forecast-service/**']
            receipt-ocr-service: ['receipt-ocr-service/**']
            notification-service: ['notification-service/**']
            reconciliation-service: ['reconciliation-service/**']

      - name: Compute per-service matrices (changed services only)
        id: setmatrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }} # dorny: 매치된 필터명 JSON 배열
        run: |
          set -euo pipefail
          # 배포 단위 단일 출처: service → image_suffix (build-push 주석의 매핑과 반드시 일치)
          mapping='{
            "market-stream-service":"-market-stream",
            "payment-webhook-service":"-payment-webhook",
            "screening-backtest-service":"-screening-backtest",
            "settlement-anomaly-service":"-anomaly",
            "forecast-service":"-forecast",
            "notification-service":"-notification",
            "reconciliation-service":"-reconciliation"
          }'
          # 검증만 하고 이미지는 만들지 않는 서비스. Dockerfile 이 없어 배포 단위가 아니므로
          # mapping(=배포 단위)에 넣으면 push 매트릭스가 없는 Dockerfile 을 빌드하려다 죽는다.
          test_only='["receipt-ocr-service"]'
          langs='{
            "go":["market-stream-service","payment-webhook-service"],
            "python":["screening-backtest-service","settlement-anomaly-service","forecast-service","receipt-ocr-service"],
            "kotlin":["notification-service","reconciliation-service"]
          }'
          all_services=$(echo "$mapping" | jq -c --argjson t "$test_only" 'keys + $t | unique')
          if echo "$CHANGED" | jq -e 'index("workflow")' >/dev/null; then
            # 워크플로 자체 변경 → 전 서비스 재검증(배포 단위 + 검증 전용)
            services="$all_services"
          else
            services=$(echo "$all_services" | jq -c --argjson ch "$CHANGED" 'map(select(. as $k | $ch | index($k)))')
          fi
          go_matrix=$(echo "$langs" | jq -c --argjson s "$services" '.go | map(select(. as $k | $s | index($k)))')
          py_matrix=$(echo "$langs" | jq -c --argjson s "$services" '.python | map(select(. as $k | $s | index($k)))')
          kt_matrix=$(echo "$langs" | jq -c --argjson s "$services" '.kotlin | map(select(. as $k | $s | index($k)))')
          include=$(echo "$mapping" | jq -c --argjson s "$services" '[to_entries[] | select(.key as $k | $s | index($k)) | {name:.key, suffix:.value}]')
          {
            echo "go_matrix=$go_matrix"
            echo "go_any=$(echo "$go_matrix" | jq 'length > 0')"
            echo "py_matrix=$py_matrix"
            echo "py_any=$(echo "$py_matrix" | jq 'length > 0')"
            echo "kt_matrix=$kt_matrix"
            echo "kt_any=$(echo "$kt_matrix" | jq 'length > 0')"
            echo "push_matrix={\"include\":$include}"
            echo "push_any=$(echo "$include" | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"
          echo "검증 대상 서비스: $services"

  go:
    name: Go build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.go_matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # 커버리지 게이트 — 자바 모듈의 JaCoCo LINE 0.90 과 같은 기준선.
      # 측정 범위는 ./internal/... 이다. cmd/server 는 부트스트랩(플래그 읽고 배선하고 리스닝)이라
      # 자바 게이트가 `**/*Application*` 을 빼는 것과 같은 이유로 제외한다 — 다만 거기 있는 순수
      # 헬퍼(getenv·parseBrokers·loadConfig·buildSource)는 `go test ./...` 가 그대로 돌린다.
      - name: Coverage gate (internal >= 90%)
        run: |
          set -euo pipefail
          go test -covermode=atomic -coverprofile=coverage.out ./internal/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%","",$3); print $3 }')
          echo "internal 커버리지: ${total}% (기준 90%)"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 90) ? 0 : 1 }' || {
            echo "::error::${{ matrix.service }} 커버리지 ${total}% < 90%"
            go tool cover -func=coverage.out | grep -v '100.0%$' || true
            exit 1
          }

  python:
    name: Python test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.py_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.py_matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # --only-binary :all: — sdist 를 받지 않는다. 소스 배포는 설치 도중 setup.py 를 실행하므로
      # 침해된 패키지가 러너에서 임의 코드를 돌리는 통로가 된다. 3개 파이썬 서비스의 requirements 는
      # 전이 의존까지 전부 휠로 해결됨을 실측 확인했다(pip download --only-binary :all:, py3.11).
      # pip 자체 업그레이드 스텝은 없앴다 — setup-python 이 주는 pip 을 그대로 쓰면 버전이 고정된다.
      - name: Install deps
        run: |
          [ -f requirements.txt ] && pip install --only-binary :all: -r requirements.txt || true
          [ -f requirements-dev.txt ] && pip install --only-binary :all: -r requirements-dev.txt || true
          pip install --only-binary :all: "pytest==9.1.1" "httpx==0.28.1" "pytest-cov==7.0.0"
      # 커밋된 골든셋이 참조하는 영수증 이미지는 **생성 산출물**(build/images, gitignore)이라
      # 새 체크아웃에는 없다. 그대로 두면 test_goldenset 이 "이미지 없음"으로 떨어진다.
      # 같은 시드(빌더 기본값)·같은 건수로 다시 렌더해 복원한다 — 생성기가 결정적이라 골든셋
      # JSON 은 내용까지 동일하게 나오고, 그 사실 자체가 "커밋된 셋이 재현 가능한가"를 검증한다.
      # 달라지면 생성기와 커밋된 셋이 어긋난 것이므로 조용히 넘기지 않고 여기서 멈춘다.
      - name: Restore golden-set images
        if: matrix.service == 'receipt-ocr-service'
        run: |
          set -euo pipefail
          # 렌더러는 한글 폰트가 없으면 **예외로 끊는다**(두부 글자로 조용히 렌더하면 골든셋이
          # 통째로 쓰레기가 되므로 fail-fast 가 맞는 자리다). ubuntu 러너에는 CJK 폰트가 없어
          # 여기서 깔아 준다 — 후보 경로 중 /usr/share/fonts/truetype/nanum/NanumGothic.ttf.
          # 폰트가 달라도 골든셋 JSON(정답 라벨)은 바뀌지 않는다: 생성기는 폰트와 무관하고
          # 렌더러는 이미지 픽셀만 만든다.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum > /dev/null
          count=$(python -c "import json;print(json.load(open('data/goldenset.json'))['count'])")
          echo "골든셋 복원: ${count}건 (시드는 빌더 기본값)"
          PYTHONPATH=src python -m receipt_ocr build --count "$count"
          git diff --quiet -- data/goldenset.json || {
            echo "::error::재생성한 골든셋이 커밋본과 다르다 — 생성기와 커밋된 셋이 어긋났다"
            git --no-pager diff --stat -- data/goldenset.json
            exit 1
          }

      # 커버리지 게이트 — 자바 모듈의 JaCoCo LINE 0.90 과 같은 기준선.
      # 분모는 반드시 `src` 다. 옵션 없이 재면 커버리지는 **테스트가 import 한 파일만** 세고,
      # `--cov=.` 로 재면 100% 인 테스트 파일 자체가 분모에 섞여 수치를 부풀린다
      # (실측: forecast-service 가 `--cov=.` 로는 93%, `--cov=src` 로는 87% 였다).
      - name: Test with coverage gate (src >= 90%)
        run: pytest -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=90

  kotlin:
    name: Kotlin build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kt_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.kt_matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      # `build` 는 `check` 를 거치고, 두 모듈 모두 check → jacocoTestCoverageVerification
      # (LINE 0.90, 자바 모듈과 같은 기준선)을 걸어 뒀다. 별도 스텝이 필요 없다.
      - run: ./gradlew build --no-daemon

  # 이미지 빌드 & ghcr 푸시 — push 이벤트(main/develop)에서 **변경된 서비스만**. 테스트 통과 후 실행.
  # 각 서비스는 자체 Dockerfile → ghcr.io/myoungsoo7/settlement-<suffix>.
  #   market-stream-service       → -market-stream
  #   payment-webhook-service     → -payment-webhook
  #   screening-backtest-service  → -screening-backtest
  #   settlement-anomaly-service  → -anomaly
  #   forecast-service            → -forecast
  #   notification-service        → -notification
  #   reconciliation-service      → -reconciliation
  # 태그: <branch> / <branch>-<sha7> / latest(기본브랜치). image-updater 가 <branch>-<sha7> 추적.
  # 언어 잡이 skipped 인 것은 "그 언어에 변경 없음"이므로 통과 — failure/cancelled 만 차단.
  build-push:
    name: Build & Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes, go, python, kotlin]
    # PR 에서도 돈다 — 다만 푸시하지 않고 **빌드만** 한다(아래 push 조건).
    # 종전에는 `github.event_name == 'push'` 라 PR 체크에 docker build 가 없었다. 언어 잡은
    # go build·pytest·gradlew build 를 돌 뿐 Dockerfile 을 읽지 않으므로, Dockerfile 만 바꾼
    # PR 은 이미지를 한 번도 만들지 않고 초록이 된다 — 실측: PR #233(베이스 이미지 bump)에서
    # 이 잡이 매트릭스 전개도 되기 전에 skipped 였다(체크 이름이 치환 안 된 표현식 원문으로 남았다).
    if: |
      !cancelled()
      && needs.changes.outputs.push_any == 'true'
      && needs.go.result != 'failure' && needs.go.result != 'cancelled'
      && needs.python.result != 'failure' && needs.python.result != 'cancelled'
      && needs.kotlin.result != 'failure' && needs.kotlin.result != 'cancelled'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.push_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            # PR 에서는 event=branch 가 태그를 만들지 않는다. 태그가 0개면 build-push 가 설 수 없고
            # (load 대상이 없다) Trivy 의 tags[0] 참조도 깨진다 — PR 전용 태그를 하나 보장한다.
            # push 이벤트에서는 이 줄이 적용되지 않아 기존 태그 구성이 그대로다.
            type=ref,event=pr
            # PR 이벤트에서는 {{branch}} 가 빈 값이라 "-<sha7>" 꼴의 불법 태그가 된다(대시 시작).
            # 어차피 PR 은 푸시하지 않으므로 sha 태그 자체를 끈다.
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.name }}
          file: ./${{ matrix.name }}/Dockerfile
          # PR 은 빌드까지만 — Dockerfile 이 실제로 서는지 확인하는 게 목적이고 태그를 올릴
          # 이유는 없다. load 는 하지 않는다(ci.yml 과 달리 이 워크플로에는 이미지 스캐너가
          # 없어 로컬 이미지를 쓸 소비자가 없다 — 디스크만 쓴다).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
