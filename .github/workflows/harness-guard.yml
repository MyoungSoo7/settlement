# Harness guard — machine-enforces money/architecture invariants + doc-drift on every PR.
# Plugin-independent (uses only scripts/harness/*), so it holds even where the copilot
# plugin / MCP is absent. Complements ci.yml (build/test/coverage), does not replace it.
name: harness-guard

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 가드는 부작용이 없으므로 PR·push 모두 최신 커밋만 검증하면 된다.
concurrency:
  group: harness-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base for diff

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run harness tests
        run: node --test scripts/harness/test/*.test.mjs

      - name: Compute changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            BASE="$(git merge-base HEAD "refs/remotes/origin/$BASE_REF")"
            test -n "$BASE"
            git cat-file -e "$BASE^{commit}"
            git diff --name-only --diff-filter=ACMR "$BASE" HEAD > changed.txt
            git diff --name-only --diff-filter=D "$BASE" HEAD > deleted.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [[ ! "$BEFORE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "invalid push before SHA: $BEFORE" >&2
              exit 1
            fi
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > changed.txt
              : > deleted.txt
            else
              git cat-file -e "$BEFORE^{commit}"
              git diff --name-only --diff-filter=ACMR "$BEFORE" HEAD > changed.txt
              git diff --name-only --diff-filter=D "$BEFORE" HEAD > deleted.txt
            fi
          else
            echo "unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi
          echo "changed files:"
          cat changed.txt

      - name: Money / architecture guard (changed files)
        run: node scripts/harness/guard.mjs --list changed.txt

      # 삭제는 changed.txt(ACMR)에 담기지 않는다 — 하네스 경로가 지워졌는지 별도로 검사한다.
      # PR #210 에 섞여 .claude/.codex/docs/harness 270 파일이 지워진 사고를 막는 지점.
      - name: Harness deletion guard (deleted files)
        run: node scripts/harness/guard.mjs --deleted-list deleted.txt

      - name: Harness self-audit (doc drift, routing, guard integrity)
        run: node scripts/harness/harness-audit.mjs

      - name: Verify manifest tracking
        shell: bash
        run: |
          set -euo pipefail
          node -e "for (const path of require('./scripts/harness/manifest.json').requiredTrackedFiles) process.stdout.write(path + '\0')" |
            xargs -0 git ls-files --error-unmatch -- >/dev/null

      # RAG 지식베이스는 화이트리스트(docs/knowledge/manifest.txt)에 등재된 문서만 적재한다.
      # 여기서 잡는 것은 반대 방향의 사고다 — 문서를 추가하고 등재를 잊는 경우. 그러면 그 문서는
      # 조용히 적재되지 않은 채 "썼으니 챗봇이 안다"고 오해하게 된다. 네트워크를 타지 않으므로
      # (표준 라이브러리만, HTTP 없음) 어느 PR 에서 돌아도 비용이 없다.
      - name: Knowledge manifest guard
        run: python3 scripts/knowledge/sync_knowledge.py --check-manifest

      - name: Verify clean working tree
        run: git diff --exit-code

      # 러너는 매 실행 폐기되고 .claude/harness/logs 는 gitignore 대상이라, 여기서 걷어내지
      # 않으면 가드가 몇 번 돌았고 무엇을 막았는지가 영구히 사라진다. 규칙을 고친 뒤
      # "효과가 있었나"를 사후에 판정하려면 실행 이력이 남아야 한다. 게이트가 아니므로 always().
      - name: Harness telemetry report
        if: always()
        run: node scripts/harness/telemetry-report.mjs || true

      - name: Upload harness telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .claude/harness/logs/
          if-no-files-found: ignore
          retention-days: 30
