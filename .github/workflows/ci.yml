name: ci

# develop 도 게이트한다 (2026-08-02).
#   그동안 이 워크플로는 main 에서만 돌았다. 그래서 develop 에는 Java 빌드·테스트 게이트가
#   아예 없었고(로컬에서 돌리는 수밖에 없었다), develop-<sha> 이미지도 만들어지지 않아
#   운영 전에 통과시킬 staging 배포 대상 자체가 없었다. 5월 hotfix 5건이 전부 운영에서
#   처음 드러난 구조적 이유다.
#   develop push 는 backend-ci/frontend-ci 로 게이트되고 develop-<sha> 이미지를 만든다.
#   운영 도메인을 때리는 production-revision-smoke 는 ref == main 조건이 그대로라 안 돈다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치에 연속 push 하면 이전 실행이 러너를 계속 점유한다(백엔드 잡 정상 55~70분).
# PR 은 최신 커밋만 검증하면 되므로 취소하고, main/develop push 는 이미지 푸시가 걸려 있어
# 취소하지 않고 직렬화만 한다(앞 실행이 끝나야 다음이 시작 → 이미지 태그 경합 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "25"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # dorny/paths-filter 는 pull_request 이벤트에서 변경 파일 목록을 GitHub API(listFiles)로 읽는다.
    # 리포의 default workflow permissions 가 read 로 내려가 있으면 이 잡만 조용히 실패하고,
    # 뒤따르는 backend/frontend 잡이 전부 skipping 이 되어 *게이트 없이 초록불*이 된다
    # (2026-08-01 PR #199 에서 실측: "Resource not accessible by integration").
    # 리포 기본 설정과 무관하게 돌도록 최소 권한을 명시한다.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # 변경된 백엔드 서비스만 담은 이미지 빌드 매트릭스: {"include":[{module,image_suffix},...]}
      build_matrix: ${{ steps.setmatrix.outputs.matrix }}
      # 빌드할 서비스가 하나라도 있으면 true (backend-ghcr 실행 게이트)
      build_any: ${{ steps.setmatrix.outputs.any }}
      # backend-ci 가 실행할 gradle 테스트 태스크 (변경 모듈만 / shared·모호 변경 시 전체 build)
      test_tasks: ${{ steps.setmatrix.outputs.test_tasks }}
      # shared-common(composite included build) 변경 여부 — 루트 build 태스크는 included build 의
      # test 를 실행하지 않으므로, true 면 backend-ci 가 shared-common 자체 게이트를 별도 실행한다.
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - '**'
              - '!frontend/**'
            # shared: 전 서비스 이미지에 영향 → 변경 시 17개 전부 재빌드
            # (건수 정본은 settings.gradle.kts — harness-audit 의 ci-matrix 규칙이 대조한다)
            shared:
              - 'shared-common/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            order-service: ['order-service/**']
            settlement-service: ['settlement-service/**']
            gateway-service: ['gateway-service/**']
            account-service: ['account-service/**']
            operation-service: ['operation-service/**']
            loan-service: ['loan-service/**']
            financial-statements-service: ['financial-statements-service/**']
            economics-service: ['economics-service/**']
            company-service: ['company-service/**']
            market-service: ['market-service/**']
            common-data-service: ['common-data-service/**']
            ai-service: ['ai-service/**']
            investment-service: ['investment-service/**']
            organization-service: ['organization-service/**']
            card-service: ['card-service/**']
            insurance-service: ['insurance-service/**']
            deposit-service: ['deposit-service/**']

      - name: Compute image build matrix (changed services only)
        id: setmatrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }} # dorny: 매치된 필터명 JSON 배열
        run: |
          set -euo pipefail
          # 배포 단위 단일 출처: module → image_suffix (아래 backend-ghcr 주석의 매핑과 반드시 일치)
          mapping='{
            "order-service":"",
            "settlement-service":"-settlement",
            "gateway-service":"-gateway",
            "account-service":"-account",
            "operation-service":"-operation",
            "loan-service":"-loan",
            "financial-statements-service":"-financial",
            "economics-service":"-economics",
            "company-service":"-company",
            "market-service":"-market",
            "common-data-service":"-common-data",
            "ai-service":"-ai",
            "investment-service":"-investment",
            "organization-service":"-organization",
            "card-service":"-card",
            "insurance-service":"-insurance",
            "deposit-service":"-deposit"
          }'
          if echo "$CHANGED" | jq -e 'index("shared")' >/dev/null; then
            # 공용 변경 → 전 서비스 재빌드
            include=$(echo "$mapping" | jq -c '[to_entries[] | {module:.key, image_suffix:.value}]')
          else
            # 변경된 서비스만 (필터명 == 모듈 디렉터리명)
            include=$(echo "$mapping" | jq -c --argjson ch "$CHANGED" \
              '[to_entries[] | select(.key as $k | $ch | index($k)) | {module:.key, image_suffix:.value}]')
          fi
          count=$(echo "$include" | jq 'length')
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "이미지 빌드 대상 서비스: ${count}개 → $include"
          # 테스트 태스크: shared 변경→전체 build, 변경 서비스만 있으면 해당 모듈만,
          # 그 외(모듈·shared 모두 아닌 모호한 backend 변경)→안전하게 전체 build (게이트 약화 방지)
          if echo "$CHANGED" | jq -e 'index("shared")' >/dev/null; then
            test_tasks="build"
          elif [ "$count" -gt 0 ]; then
            test_tasks=$(echo "$include" | jq -r '[.[] | ":\(.module):build"] | join(" ")')
          else
            test_tasks="build"
          fi
          echo "test_tasks=$test_tasks" >> "$GITHUB_OUTPUT"
          echo "테스트 태스크: $test_tasks"

  backend-ci:
    name: Backend - Build/Test/JaCoCo/SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 90 # hang 시 러너 6시간 낭비 방지 (정상 55~70분 + 여유)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read # ghcr 미러 이미지 pull (mirror-testcontainers.yml 참고)
    services:
      postgres:
        # Docker Hub rate limit 회피 — ghcr 미러 사용 (mirror-testcontainers.yml 로 갱신)
        image: ghcr.io/myoungsoo7/mirror/postgres:17
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트가 서비스 PG 를 쓸 수 있도록 스키마를 빌드 전에 준비
      - name: Init schema (opslab)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "CREATE SCHEMA IF NOT EXISTS opslab;"

      # Testcontainers 가 ghcr 미러(비공개 패키지 가능)에서 pull 할 수 있게 데몬 로그인.
      # Docker Hub rate limit 회피 — 각 모듈 testcontainers.properties 의
      # hub.image.name.prefix=ghcr.io/myoungsoo7/mirror/ 와 세트.
      - name: Login to GHCR (for Testcontainers pulls)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # shared-common 은 composite included build — 루트 build 태스크는 jar 만 만들 뿐
      # included build 의 test 를 실행하지 않는다. shared 변경 시 자체 빌드로 직접 실행해
      # 자체 게이트(LINE 90% + outbox.domain INSTRUCTION 80%, shared-common/build.gradle.kts)를 강제한다.
      - name: Build & Test shared-common (JaCoCo gate)
        if: needs.changes.outputs.shared == 'true'
        run: ./gradlew -p shared-common clean build --no-daemon --stacktrace
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # build = compile + test + jacocoTestReport + jacocoTestCoverageVerification (게이트 포함, build.gradle.kts:157)
      # test_tasks = 변경 모듈만(`:<mod>:build`) / shared·모호 변경 시 전체 `build` (changes 잡이 산출)
      # Testcontainers 기반 통합테스트는 러너의 Docker 데몬을 사용한다.
      - name: Build & Test (JaCoCo gate)
        run: ./gradlew clean ${{ needs.changes.outputs.test_tasks }} --no-daemon --stacktrace
        env:
          # ryuk(정리용 유틸 컨테이너) 비활성화 — 러너는 일회용이라 불필요하고,
          # 이미지 치환과 얽혀 모듈별 test JVM 에서 비결정적 hang 을 유발했다 (2026-07-08).
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200

      - name: Upload test/coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-reports
          path: |
            */build/reports/jacoco/test/
            */build/reports/tests/test/
          retention-days: 30

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@db72e7e7c96f98d239967958b0a0a6ca7d3bb45f # v1.6.1
        with:
          paths: ${{ github.workspace }}/*/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ 순서 주의: SCA(보안 게이트)가 SonarCloud(품질 분석)보다 *먼저* 온다.
      #   원래는 반대였는데, 2026-08-12 run 31602739861 에서 SONAR_TOKEN 만료(HTTP 403)로
      #   Sonar 스텝이 실패하자 뒤따르던 SBOM·Trivy 가 통째로 skip 됐다 — 무관한 도구의 인증
      #   문제로 보안 게이트가 조용히 사라진 것이고, 이 작업이 없애려던 실패 양식 그대로다.
      #   보안 게이트를 앞에 두면 품질 도구의 사정과 무관하게 항상 판정된다.
      #
      # ── SCA (의존성 취약점) — Snyk 을 걷어내고 SBOM + Trivy 로 갈아탔다 (2026-08-12).
      #
      # Snyk 을 뺀 이유(실측, run 31432558450):
      #   ERROR Authentication error (SNYK-0005) — 토큰이 무효라 스캔 자체가 시작되지 않았고,
      #   ✗ 21/21 detected Gradle manifests did not return dependencies — 의존성 해석도 실패했다.
      #   continue-on-error 가 둘 다 삼켜서 "SCA 가 돌고 있다"는 초록불만 남아 있었다.
      # 지금 방식은 외부 계정·토큰에 의존하지 않는다(전부 러너 안에서 끝난다).
      #
      # CycloneDX 는 루트에 적용하면 17개 서비스 전부를 합친 aggregate BOM 을 만든다
      # (build/reports/cyclonedx/bom.json — 실측 451 컴포넌트).
      - name: Generate SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom --no-daemon

      # if: always() 를 뗐다 — SBOM 생성이 skip/실패했는데도 업로드가 돌아 빈손으로 성공하던
      # 스텝이었다(run 31599697053: Generate 는 skipped, Upload 는 success). 스캔은 이 뒤에
      # 오므로 스캔이 실패해도 이 업로드는 이미 끝나 있다 — always() 가 필요 없다.
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 90

      # 차단 게이트. 기존 부채 48건은 .trivyignore.yaml 에 만료일과 함께 명시돼 있고,
      # 거기 없는 신규 HIGH/CRITICAL 이 하나라도 나오면 exit 1 로 막는다(semgrep.yml 과 같은 기준).
      # version 고정: 이 게이트를 켤 때 부채 건수를 실측한 바이너리와 동일 버전을 쓴다.
      - name: SCA — Trivy SBOM scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: sbom
          scan-ref: build/reports/cyclonedx/bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

      # 게이트다 — continue-on-error 를 뗐다(2026-08-12).
      # 그전까지 이 스텝은 sonarqube 플러그인 5.1.0.4882 가 Gradle 9 에서 제거된 Convention API 를
      # 호출해 NoSuchMethodError 로 13초 만에 죽었고, continue-on-error 가 그걸 삼켰다.
      # 즉 SonarCloud 분석은 한 번도 업로드된 적이 없다(run 31432558450 로그가 근거).
      # 지금 이 스텝이 막는 것은 "분석이 안 돌았다"까지다 — 플러그인 크래시·토큰 만료처럼
      # 분석 자체가 실패하면 이 잡이 깨지고, 그러면 backend-ghcr 가 이미지를 만들지 않는다.
      # 품질 게이트 *내용*은 아직 차단하지 않는다(sonar.qualitygate.wait=false, build.gradle.kts).
      #
      # ⚠ 현재 SONAR_TOKEN 은 만료 상태다 — run 31602739861 실측:
      #   "GET https://api.sonarcloud.io/analysis/jres... failed with HTTP 403 Forbidden.
      #    Please check the property sonar.token or the environment variable SONAR_TOKEN."
      #   토큰은 2026-02-24 등록분이고 마지막 분석은 2026-02-26 이다. 이 스텝이 초록이 되려면
      #   SonarCloud 에서 토큰을 재발급해 저장소 시크릿 SONAR_TOKEN 을 갱신해야 한다.
      - name: SonarCloud Scan (analysis must succeed)
        if: github.event_name != 'pull_request'
        run: ./gradlew sonar --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200

  # (제거) 주석 처리돼 있던 sonarqube-quality-gate-action 블록 — build.gradle.kts 의
  # sonar.qualitygate.wait=true 가 같은 일을 하므로(분석 태스크가 게이트 결과를 기다렸다가 실패)
  # 별도 액션이 필요 없다. 죽은 주석은 "게이트가 있다"는 착시만 남긴다.

  backend-ghcr:
    name: Backend - Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [changes, backend-ci]
    if: github.event_name != 'pull_request' && needs.changes.outputs.build_any == 'true'
    permissions:
      contents: read
      packages: write
    # 배포 단위별 이미지(ADR 0020) — 변경된 백엔드 서비스만 이미지화(매트릭스는 changes 잡이 계산).
    #   order-service        → ghcr.io/myoungsoo7/settlement
    #   settlement-service   → ghcr.io/myoungsoo7/settlement-settlement
    #   gateway-service      → ghcr.io/myoungsoo7/settlement-gateway
    #   account-service      → ghcr.io/myoungsoo7/settlement-account
    #   operation-service    → ghcr.io/myoungsoo7/settlement-operation
    #   loan-service         → ghcr.io/myoungsoo7/settlement-loan
    #   financial-*-service  → ghcr.io/myoungsoo7/settlement-financial
    #   economics-service    → ghcr.io/myoungsoo7/settlement-economics
    #   company-service      → ghcr.io/myoungsoo7/settlement-company
    #   market-service       → ghcr.io/myoungsoo7/settlement-market
    #   common-data-service  → ghcr.io/myoungsoo7/settlement-common-data
    #   ai-service           → ghcr.io/myoungsoo7/settlement-ai
    #   investment-service   → ghcr.io/myoungsoo7/settlement-investment
    #   organization-service → ghcr.io/myoungsoo7/settlement-organization
    #   card-service         → ghcr.io/myoungsoo7/settlement-card
    #   insurance-service    → ghcr.io/myoungsoo7/settlement-insurance
    #   deposit-service      → ghcr.io/myoungsoo7/settlement-deposit
    # shared-common·루트 빌드파일·Dockerfile·ci.yml 변경 시엔 changes 잡이 17개 전부 매트릭스에 담는다.
    strategy:
      fail-fast: false # 한 서비스 빌드 실패가 다른 서비스 이미지 푸시를 취소하지 않도록
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 준비: Docker Hub 로그인 (추후 사용)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 의 ARG MODULE 가 비어있으면 'gradle ::bootJar' 처럼 빈 세그먼트가 되어 빌드 실패.
          # matrix.module selects the deployable Gradle service built into this image.
          build-args: |
            MODULE=${{ matrix.module }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # 컨테이너 레이어(OS 패키지 + 번들 라이브러리) 취약점 스캔.
      # Snyk 은 Gradle 의존성만 보고 그마저 continue-on-error 라, 베이스 이미지 CVE 는
      # 지금까지 아무도 보지 않았다.
      # 게이트 범위: CRITICAL + 이미 수정 버전이 나온 것만(ignore-unfixed) — 미수정 CVE 로
      # 파이프라인이 막히는 상황을 피한다. HIGH 까지 조이려면 severity 에 추가할 것.
      # 스캔은 push 뒤에 돈다(이미지는 이미 올라간 상태) — 잡이 빨개지면 롤백 판단은 사람이 한다.
      #
      # ⚠ 이 액션은 두 번 깨져 있었다 (둘 다 CI 실측으로 잡음):
      #   ① 원래 `@0.28.0` 으로 적혀 있었는데 그런 ref 자체가 없다(실제 태그는 v0.28.0).
      #   ② v0.28.0 은 내부적으로 `aquasecurity/setup-trivy@v0.2.1` 을 부르는데 업스트림에서
      #      그 태그가 사라져, 바깥 액션을 SHA 로 고정해도 잡 시작 즉시
      #      "Unable to resolve action ... unable to find version v0.2.1" 로 죽는다
      #      (2026-08-12 run 31592237712 에서 실측).
      #   v0.36.0 은 setup-trivy 를 커밋 SHA 로 참조해 태그 삭제에 영향을 받지 않는다.
      #   교훈: 액션을 SHA 로 핀해도 그 액션이 내부에서 쓰는 참조까지 고정되지는 않는다.
      - name: Trivy image scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend-ci:
    name: Frontend - Production Build & Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Production typecheck (excludes test files)
      - name: TypeScript type check (production code only)
        working-directory: frontend
        run: npm run typecheck

      # 테스트 코드도 타입 검증한다 — 프로덕션 typecheck 만 돌던 동안 테스트 쪽 타입 오류가
      # 쌓여도 CI 가 잡지 못했다(jest-dom 매처 미배선으로 123건 누적된 전례).
      - name: TypeScript type check (test code)
        working-directory: frontend
        run: npm run typecheck:tests

      # 부채(any 83건·exhaustive-deps 10건·react-refresh 2건)를 모두 정리해 현재 0 problems 이므로
      # `--max-warnings 0` 으로 강제한다 — 경고 하나만 새로 생겨도 CI 가 막는다.
      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      # Build production bundle
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY || 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # ── SCA (의존성 취약점) — backend-ci 와 같은 이유로 Snyk 을 걷어냈다(토큰 무효, 2026-08-12).
      # npm 내장 audit 이라 외부 계정·토큰이 필요 없다.
      #
      # --omit=dev: 게이트 대상은 *프로덕션 번들에 들어가는* 의존성이다. dev 전용(vite·vitest 등)
      #   취약점은 사용자에게 배포되지 않는데 여기서 막으면 노이즈로 게이트가 무시당한다
      #   (실측 2026-08-12: 전체 16건 / 프로덕션 3건). dev 쪽은 Dependabot 이 주간으로 올린다.
      # 차단이다 — continue-on-error 없음. 새 프로덕션 high 취약점이 들어오면 여기서 막힌다.
      - name: SCA — npm audit (production deps, high gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # 프론트 단위/컴포넌트 테스트 게이트.
  # 2026-08-02 까지 `if: false` 로 꺼져 있었고 frontend-ci 에도 `npm test` 가 없어서,
  # Vitest 가 *어느 브랜치에서도 CI 에서 한 번도 돌지 않았다*. 회귀 테스트를 붙여도
  # 게이트가 되지 못했다는 뜻이라(#184 금액 정밀도 수정에서 실측) 켠다.
  # 켜기 전 실측: develop 27 파일 297 테스트 전부 통과, 27초.
  frontend-tests:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # coverage 를 켜서 아래 업로드 스텝이 실제로 뭔가를 올리게 한다
      # (test:run 은 coverage/ 를 만들지 않아 업로드가 늘 빈손이었다)
      - name: Run tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage
          retention-days: 30

  frontend-ghcr:
    name: Frontend - Build & Push to GHCR
    runs-on: ubuntu-latest
    # frontend-tests 를 needs 에 넣지 않으면 Vitest 가 실패해도 이미지가 그대로 푸시된다
    # (테스트는 빨간불, 배포는 진행 — 게이트를 켠 의미가 없어진다).
    needs: [changes, frontend-ci, frontend-tests]
    if: github.event_name != 'pull_request' && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '' }}
            VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY || 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # backend-ghcr 와 같은 기준. 프론트 런타임 베이스는 nginx:1.25-alpine 로 고정돼 있어
      # 여기서 CRITICAL 이 먼저 뜰 가능성이 있다 — 그때 답은 스캔을 끄는 게 아니라 베이스 태그를 올리는 것.
      - name: Trivy image scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # main 머지 후 ArgoCD plain Directory 앱의 manifest reconciliation 시간을 둔 다음,
  # 현재 배포된 운영 revision(jen.lemuel.co.kr)을 E2E smoke 한다.
  # 이 job은 새 mutable image tag의 promotion을 증명하지 않는다.
  #
  # needs 의 4 단계 (ci + ghcr) 를 모두 포함 — ci 가 실패하면 ghcr 는 skipped 되어
  # `result != 'failure'` 는 통과해버림. 그래서 ci.result 도 직접 검사: success/skipped 만 허용.
  # paths-filter 로 변경 없는 쪽은 skipped 되니 success/skipped 양쪽 다 통과시킴.
  production-revision-smoke:
    name: Currently deployed production revision smoke
    runs-on: ubuntu-latest
    needs:
      [frontend-ci, frontend-tests, frontend-ghcr, backend-ci, backend-ghcr]
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && always()
      && !cancelled()
      && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped')
      && (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')
      && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped')
      && (needs.frontend-ghcr.result == 'success' || needs.frontend-ghcr.result == 'skipped')
      && (needs.backend-ghcr.result == 'success' || needs.backend-ghcr.result == 'skipped')
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: https://jen.lemuel.co.kr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (chromium/firefox/webkit)
        working-directory: frontend
        run: npm run e2e:install

      # ArgoCD가 Git의 plain Directory manifest를 reconcile할 시간만 제공한다.
      # 새 이미지 promotion 여부를 보장하지 않으며, 현재 배포 revision을 대상으로 한다.
      - name: Wait for ArgoCD manifest reconciliation
        run: sleep 180

      - name: Run Playwright E2E against jen.lemuel.co.kr
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
